<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TOY BOX</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17100c;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;user-select:none;color:#f5dfb5}body{background:radial-gradient(circle at 50% 22%,#49301d,#160f0b 72%)}
#room{height:100%;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}header{text-align:center;padding:18px 0 8px}h1{margin:0;font:800 24px Georgia,serif;letter-spacing:.16em;text-shadow:0 2px #000}header small{opacity:.55;font-size:10px;letter-spacing:.18em}
#box{position:relative;flex:1;width:min(100%,560px);margin:8px 0 20px;overflow:hidden;border:9px solid #6d3e1e;border-radius:15px 15px 26px 26px;background:repeating-linear-gradient(90deg,#7d4824 0 46px,#75401f 46px 49px);box-shadow:inset 0 0 50px #251108,0 18px 35px #0009,0 0 0 3px #32180d}
#box:before{content:'TOYS';position:absolute;z-index:8;left:50%;bottom:13px;transform:translateX(-50%);padding:5px 15px;border:2px solid #3a1e10;background:#a26732;color:#39200f;font:bold 12px Georgia;letter-spacing:.18em;box-shadow:0 2px 5px #0008}
.toy{position:absolute;border:0;background:none;padding:0;filter:drop-shadow(2px 4px 2px #0007);font-size:34px;line-height:1;transition:transform .15s;animation:bob 4s ease-in-out infinite;z-index:2}.toy:active{transform:scale(.82) rotate(8deg)}.toy span{display:block;font-size:7px;color:#f6ddb1;background:#28150dcc;padding:3px 5px;border-radius:6px;margin-top:4px;opacity:0;transition:.2s;white-space:nowrap}.toy:focus span,.toy:active span{opacity:1}@keyframes bob{50%{translate:0 -3px}}
#rock{font-size:44px;animation:none}.pixel{width:9px;height:9px;background:#f6d35c;box-shadow:9px 0 #f6d35c,18px 0 #f6d35c,0 9px #f6d35c,9px 9px #222,18px 9px #f6d35c,0 18px #222,18px 18px #222;margin:10px}.nail{width:8px;height:58px;background:#aab0b3;border-radius:2px;transform:rotate(-28deg)}.nail:before{content:'';position:absolute;width:24px;height:7px;background:#c5c9ca;left:-8px;top:-3px}.moon{width:54px;height:54px;border-radius:50%;background:#dfc866;box-shadow:inset -17px 2px #17100c}.can{font-size:42px}.crab{font-size:42px}.fish{font-size:42px;transform:rotate(12deg)}
#hint{position:absolute;left:0;right:0;top:9px;text-align:center;font:10px Georgia;letter-spacing:.12em;opacity:.55;pointer-events:none}
#player{display:none;position:fixed;inset:0;z-index:50;background:#090807}#player iframe{width:100%;height:100%;border:0}#back{position:absolute;z-index:51;top:max(12px,env(safe-area-inset-top));left:12px;border:1px solid #ffffff44;background:#111b;color:#fff;border-radius:999px;padding:9px 13px;font-weight:700;font-size:12px;backdrop-filter:blur(8px)}
</style></head><body><main id="room"><header><h1>TOY BOX</h1><small>NOTHING HERE HAS TO BE USEFUL</small></header><section id="box"><div id="hint">tap whatever looks suspicious</div></section></main><div id="player"><button id="back">← PUT IT BACK</button><iframe id="frame"></iframe></div><script>
const toys=[
['🦀','Pocket Crab','EXPERIMENTS/pocket-crab.html','crab'],['🐟','Ceiling Fish','EXPERIMENTS/ceiling-fish.html','fish'],['🥫','Tin Can Hermit','EXPERIMENTS/tin-can-hermit.html','can'],['🪨','Definitely a Rock','EXPERIMENTS/definitely-a-rock.html','rock'],['','Brave Little Pixel','EXPERIMENTS/brave-little-pixel.html','pixel'],['','Nervous Nail','EXPERIMENTS/nervous-nail.html','nail'],['🪲','Button Beetle','EXPERIMENTS/button-beetle.html',''],['🐛','Pocket Worm','EXPERIMENTS/pocket-worm.html',''],['🐔','Pocket Hen','EXPERIMENTS/pocket-hen.html',''],['🦋','Thumb Moth','EXPERIMENTS/thumb-moth.html',''],['✨','Pocket Firefly','EXPERIMENTS/pocket-firefly.html',''],['','Pixel Eclipse','EXPERIMENTS/pixel-eclipse.html','moon'],['👺','Crumb Goblin','EXPERIMENTS/crumb-goblin.html',''],['💧','Echo Puddle','EXPERIMENTS/echo-puddle.html',''],['🌧️','Magnet Rain','EXPERIMENTS/magnet-rain.html',''],['🌩️','Pocket Storm','EXPERIMENTS/pocket-storm.html',''],['•','Lonely Dot','EXPERIMENTS/lonely-dot.html','']];
const box=document.querySelector('#box'),player=document.querySelector('#player'),frame=document.querySelector('#frame');
let seed=Date.now()%997;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}toys.sort(()=>rnd()-.5).forEach((t,i)=>{let b=document.createElement('button');b.className='toy';b.style.left=(7+rnd()*78)+'%';b.style.top=(12+rnd()*70)+'%';b.style.rotate=(-18+rnd()*36)+'deg';b.style.zIndex=2+Math.floor(rnd()*5);b.style.animationDelay=(-rnd()*4)+'s';let thing=document.createElement('i');thing.className=t[3]||'';thing.style.display='block';thing.style.fontStyle='normal';thing.textContent=t[0];b.append(thing);let s=document.createElement('span');s.textContent=t[1];b.append(s);b.setAttribute('aria-label',t[1]);b.onclick=()=>{frame.src=t[2];player.style.display='block'};box.append(b)});
document.querySelector('#back').onclick=()=>{player.style.display='none';frame.src='about:blank'};
</script></body></html>
