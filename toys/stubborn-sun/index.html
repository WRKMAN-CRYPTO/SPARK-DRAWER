<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THE LITTLE SUN THAT REFUSES TO SET</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#080812;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#world{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 120%,#17172d 0 35%,#090912 70%)}
#sun{position:absolute;width:92px;height:92px;border-radius:50%;left:50%;top:28%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff7a8 0 8%,#ffd84d 28%,#ff8a2b 65%,#ef3d21 100%);box-shadow:0 0 22px #ff9f31,0 0 55px #ff5c28;transition:transform .08s linear}
#ground{position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(#15152a,#090911);clip-path:polygon(0 24%,12% 12%,24% 28%,35% 5%,48% 22%,59% 9%,72% 31%,85% 18%,100% 27%,100% 100%,0 100%)}
#meter{position:absolute;top:18px;left:18px;right:18px;height:10px;border:1px solid #ffffff44;border-radius:999px;overflow:hidden;background:#ffffff12}
#bar{height:100%;width:0%;background:#fff}
#txt{position:absolute;top:40px;left:18px;right:18px;text-align:center;font-size:14px;letter-spacing:.08em;opacity:.82}
#footer{position:absolute;bottom:18px;left:18px;right:18px;text-align:center;font-size:13px;opacity:.55}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.8}
</style>
</head>
<body>
<div id="world">
<div id="sun"></div>
<div id="ground"></div>
<div id="meter"><div id="bar"></div></div>
<div id="txt">TAP THE SUN. IT DISAGREES WITH EVENING.</div>
<div id="footer">This has no objective. The sun is simply stubborn.</div>
</div>
<script>
const world=document.getElementById('world'),sun=document.getElementById('sun'),bar=document.getElementById('bar'),txt=document.getElementById('txt');
for(let i=0;i<70;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.opacity=.25+Math.random()*.75;s.style.transform=`scale(${.5+Math.random()*1.6})`;world.appendChild(s)}
let taps=0,vx=0,vy=0,x=50,y=28;
const lines=['THE SUN HAS FILED AN APPEAL.','NIGHT IS BECOMING CONCERNED.','ASTRONOMERS HAVE STOPPED TAKING CALLS.','THE HORIZON WOULD LIKE A WORD.','THE SUN IS NOW ACTING OUT OF PRINCIPLE.','EVENING HAS BEEN CANCELLED.','THIS IS BETWEEN YOU AND THE COSMOS NOW.'];
function poke(e){const r=sun.getBoundingClientRect();const px=(e.clientX??e.touches?.[0]?.clientX??innerWidth/2);const py=(e.clientY??e.touches?.[0]?.clientY??innerHeight/2);const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=cx-px,dy=cy-py,d=Math.hypot(dx,dy)||1;vx+=dx/d*(2.5+Math.random()*2.5);vy+=dy/d*(2.5+Math.random()*2.5)-1.1;taps++;bar.style.width=Math.min(100,taps*4)+'%';txt.textContent=lines[Math.min(lines.length-1,Math.floor(taps/5))];sun.animate([{filter:'brightness(1)'},{filter:'brightness(1.8)'},{filter:'brightness(1)'}],{duration:130})}
sun.addEventListener('pointerdown',poke);
function loop(){vx*=.985;vy*=.985;vy+=.012;x+=vx*.07;y+=vy*.07;if(x<10){x=10;vx=Math.abs(vx)*.9}if(x>90){x=90;vx=-Math.abs(vx)*.9}if(y<12){y=12;vy=Math.abs(vy)*.9}if(y>58){y=58;vy=-Math.abs(vy)*1.04-.4}sun.style.left=x+'%';sun.style.top=y+'%';sun.style.transform=`translate(-50%,-50%) rotate(${taps*7}deg) scale(${1+Math.min(.18,taps*.003)})`;requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
