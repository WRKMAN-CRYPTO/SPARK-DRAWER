<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a15">
<title>The Medium Remembers</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a15;color:#e5e5ee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
canvas{display:block;width:100vw;height:100dvh;touch-action:none;cursor:crosshair}
#title{position:fixed;top:max(20px,env(safe-area-inset-top));left:22px;right:22px;font-size:11px;letter-spacing:.24em;color:#dfe4f9;pointer-events:none;text-shadow:0 2px 10px #000}
#sub{position:fixed;top:max(43px,calc(env(safe-area-inset-top) + 23px));left:22px;right:22px;font-size:10px;letter-spacing:.035em;color:#afabbf;opacity:.74;pointer-events:none}
#footer{position:fixed;bottom:max(17px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;align-items:end;justify-content:space-between;gap:12px}
#hint{font-size:10px;line-height:1.65;color:#aab4c6aa;max-width:185px;pointer-events:none}
#buttons{display:flex;gap:8px;align-items:center}
@media(max-width:580px){#footer{flex-direction:column;align-items:center;gap:9px}#hint{max-width:none;text-align:center}#buttons{justify-content:center}}
button{background:#101726d9;color:#dbe4eb;border:1px solid #6c759266;border-radius:5px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px;letter-spacing:.07em;white-space:nowrap}
button:active{background:#425066}
#clock{position:fixed;right:22px;top:max(22px,env(safe-area-inset-top));color:#dce4ea80;font-size:10px;pointer-events:none}
</style>
</head>
<body>
<canvas id="field" aria-label="Interactive wave field"></canvas>
<div id="title">THE MEDIUM REMEMBERS</div>
<div id="sub">A wave alters what carries it. The next wave inherits the change.</div>
<div id="clock">00:00</div>
<div id="footer">
<div id="hint">touch to make a ripple<br>drag to write a disturbance<br>watch the old paths</div>
<div id="buttons"><button id="auto" aria-pressed="false">AUTO OFF</button><button id="memory">MEMORY ON</button><button id="erase">ERASE</button></div>
</div>
<script>
(() => {
'use strict';
// A toy wave equation, not a physical material model.
// Energetic wavefronts write a slow, persistent refractive field.
// That field then lowers local wave speed, feeding back into later waves.
const canvas=document.getElementById('field');
const ctx=canvas.getContext('2d',{alpha:false});
const pixelCanvas=document.createElement('canvas');
const pctx=pixelCanvas.getContext('2d',{alpha:false});
const label=document.getElementById('memory');
const autoLabel=document.getElementById('auto');
const clock=document.getElementById('clock');
let nx=0,ny=0,size=0,cur,prev,next,scar,image,pixels;
let frame=0,remember=true,autoWaves=false,down=false,lastDrag=-999,elapsed=0;
const sources=[
  {x:.21,y:.28,f:61,phase:.6,amp:2.6},
  {x:.78,y:.61,f:83,phase:2.1,amp:-2.2},
  {x:.48,y:.82,f:101,phase:4.7,amp:2.7}
];
function resize(){
  const w=innerWidth,h=innerHeight;
  canvas.width=Math.round(w*Math.min(devicePixelRatio||1,1.5));
  canvas.height=Math.round(h*Math.min(devicePixelRatio||1,1.5));
  ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);
  nx=Math.max(64,Math.min(190,Math.round(w/4)));
  ny=Math.max(75,Math.min(260,Math.round(h/4)));
  size=nx*ny;
  pixelCanvas.width=nx;pixelCanvas.height=ny;
  image=pctx.createImageData(nx,ny);pixels=image.data;
  cur=new Float32Array(size);prev=new Float32Array(size);
  next=new Float32Array(size);scar=new Float32Array(size);
  frame=0;elapsed=0;
}
function pulse(x,y,power=2.5,radius=3){
  const cx=Math.floor(x),cy=Math.floor(y),rad=Math.ceil(radius*2.6),rr=radius*radius*2;
  const x0=Math.max(2,cx-rad),x1=Math.min(nx-3,cx+rad);
  const y0=Math.max(2,cy-rad),y1=Math.min(ny-3,cy+rad);
  for(let j=y0;j<=y1;j++){
    for(let i=x0;i<=x1;i++){
      const d=(i-x)*(i-x)+(j-y)*(j-y);
      const v=power*Math.exp(-d/rr);
      const k=j*nx+i;
      cur[k]+=v;prev[k]+=v;
    }
  }
}
function step(){
  // Discrete wave equation; c² <= 0.25 for comfortable 2D stability here.
  for(let y=1;y<ny-1;y++){
    const row=y*nx;
    for(let x=1;x<nx-1;x++){
      const i=row+x;
      const a=cur[i];
      const lap=cur[i-1]+cur[i+1]+cur[i-nx]+cur[i+nx]-4*a;
      const c2=.218/(1+3.4*scar[i]*(remember?1:0));
      const edge=Math.min(x,y,nx-1-x,ny-1-y);
      const damping=.9982-Math.max(0,7-edge)*.008;
      const n=(2*a-prev[i]+c2*lap)*damping;
      next[i]=n;
      if(remember){
        // Only strong crests etch the medium; almost everything fades.
        const deposition=Math.max(0,Math.abs(n)-.55)*.00054;
        scar[i]=Math.min(.97,scar[i]*.999994+deposition);
      }
    }
  }
  // Absorbing edges, rather than a wrapped-around universe.
  for(let x=0;x<nx;x++){next[x]=0;next[(ny-1)*nx+x]=0;}
  for(let y=0;y<ny;y++){next[y*nx]=0;next[y*nx+nx-1]=0;}
  const old=prev;prev=cur;cur=next;next=old;
  frame++;
  if(autoWaves) for(const s of sources){
    if(frame%s.f===0){
      const driftX=.045*Math.sin(frame*.0032+s.phase);
      const driftY=.065*Math.cos(frame*.0021+s.phase);
      pulse((s.x+driftX)*nx,(s.y+driftY)*ny,s.amp,2.15);
    }
  }
}
function render(){
  // Low-resolution image data gives the wavefield a little phosphor texture.
  let k=0;
  for(let i=0;i<size;i++){
    const a=cur[i],m=Math.min(1,scar[i]*1.5);
    const positive=Math.min(1,Math.max(0,a)*.9);
    const negative=Math.min(1,Math.max(0,-a)*.9);
    const brightness=Math.min(1,Math.abs(a)*1.6);
    pixels[k++]=Math.min(255,7+82*m+37*positive+172*negative+55*brightness*brightness);
    pixels[k++]=Math.min(255,10+30*m+177*positive+60*negative+52*brightness*brightness);
    pixels[k++]=Math.min(255,22+66*m+166*positive+147*negative+59*brightness*brightness);
    pixels[k++]=255;
  }
  pctx.putImageData(image,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(pixelCanvas,0,0,innerWidth,innerHeight);
  // Automatic sources are optional; touch alone can drive the field.
}
function erase(){
  cur.fill(0);prev.fill(0);next.fill(0);scar.fill(0);frame=0;elapsed=0;clock.textContent='00:00';
}
function coordinates(e){
  const b=canvas.getBoundingClientRect();
  return {x:(e.clientX-b.left)/b.width*nx,y:(e.clientY-b.top)/b.height*ny};
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();down=true;canvas.setPointerCapture(e.pointerId);
  const p=coordinates(e);pulse(p.x,p.y,3.4,3);
  lastDrag=performance.now();
});
canvas.addEventListener('pointermove',e=>{
  if(!down)return;
  const now=performance.now();
  if(now-lastDrag<33)return;
  lastDrag=now;
  const p=coordinates(e);pulse(p.x,p.y,1.45,2.1);
});
const stop=()=>{down=false};
canvas.addEventListener('pointerup',stop);
canvas.addEventListener('pointercancel',stop);
label.addEventListener('click',()=>{
  remember=!remember;label.textContent=remember?'MEMORY ON':'MEMORY OFF';
  label.setAttribute('aria-pressed',String(remember));
});
autoLabel.addEventListener('click',()=>{
  autoWaves=!autoWaves;
  autoLabel.textContent=autoWaves?'AUTO ON':'AUTO OFF';
  autoLabel.setAttribute('aria-pressed',String(autoWaves));
  if(autoWaves){
    // Respond immediately to the toggle, without waiting for the next timer tick.
    for(const s of sources) pulse(s.x*nx,s.y*ny,s.amp,2.15);
  }
});
document.getElementById('erase').addEventListener('click',erase);
addEventListener('resize',resize);
resize();
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  elapsed+=dt;
  // Avoid bursting many steps after tab suspension.
  const steps=Math.min(2,Math.max(1,Math.round(dt*60)));
  for(let i=0;i<steps;i++)step();
  render();
  if(frame%30===0){
    const seconds=Math.floor(elapsed);
    clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
