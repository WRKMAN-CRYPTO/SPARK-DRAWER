<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Pillbug</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a18;touch-action:none}canvas{width:100%;height:100%;image-rendering:pixelated}.note{position:fixed;left:12px;bottom:10px;color:#8e978f;font:11px monospace;pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="note">POCKET PILLBUG · bother the little tank</div><script>const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,d=1;function fit(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();let b={x:W*.5,y:H*.55,vx:0,vy:0,a:0,roll:0,startle:0,dir:1};let p={x:-999,y:-999,down:false};function poke(e){let q=e.touches?e.touches[0]:e;p.x=q.clientX;p.y=q.clientY;p.down=true;let dx=b.x-p.x,dy=b.y-p.y,r=Math.hypot(dx,dy);if(r<90){b.startle=1;b.roll=1;b.vx+=(dx/(r||1))*3.5;b.vy+=(dy/(r||1))*3.5}}addEventListener('pointerdown',poke);addEventListener('pointermove',e=>{if(e.buttons)poke(e)});addEventListener('pointerup',()=>p.down=false);function bug(){x.save();x.translate(b.x,b.y);x.rotate(b.a);if(b.roll>.04){let R=13+Math.sin(performance.now()/70)*.7;x.fillStyle='#3e4740';x.beginPath();x.arc(0,0,R,0,7);x.fill();x.strokeStyle='#798176';x.lineWidth=2;for(let i=-2;i<=2;i++){x.beginPath();x.arc(0,0,R-3,(-.7+i*.22),(.7+i*.22));x.stroke()}x.fillStyle='#111';x.fillRect(5,-4,2,2)}else{x.scale(b.dir,1);x.strokeStyle='#687169';x.lineWidth=2;for(let i=-2;i<=2;i++){x.beginPath();x.moveTo(i*5,-1);x.lineTo(i*5-4,-8-(i%2)*2);x.stroke();x.beginPath();x.moveTo(i*5,4);x.lineTo(i*5-4,11+(i%2)*2);x.stroke()}for(let i=0;i<6;i++){x.fillStyle=i%2?'#4b554d':'#59635a';x.beginPath();x.ellipse(-12+i*5,0,7,8,0,0,7);x.fill()}x.fillStyle='#657067';x.beginPath();x.ellipse(17,0,7,7,0,0,7);x.fill();x.fillStyle='#111';x.fillRect(19,-3,2,2);x.strokeStyle='#687169';x.beginPath();x.moveTo(20,-4);x.lineTo(27,-10);x.moveTo(20,4);x.lineTo(27,10);x.stroke()}x.restore()}function loop(){x.clearRect(0,0,W,H);x.fillStyle='#1d211e';x.fillRect(0,0,W,H);for(let i=0;i<20;i++){let xx=(i*83)%W,yy=(i*137)%H;x.fillStyle='#252a26';x.fillRect(xx,yy,2,2)}let t=performance.now()/1000;if(b.roll>0){b.roll-=.008;b.vx*=.985;b.vy*=.985}else{if(Math.random()<.012)b.dir*=-1;b.vx+=b.dir*.025;b.vx*=.94;b.vy*=.9;b.a=Math.sin(t*10)*.03}b.x+=b.vx;b.y+=b.vy;if(b.x<22||b.x>W-22){b.vx*=-1;b.dir*=-1}if(b.y<22||b.y>H-22)b.vy*=-1;b.x=Math.max(20,Math.min(W-20,b.x));b.y=Math.max(20,Math.min(H-20,b.y));bug();requestAnimationFrame(loop)}loop()</script></body></html>
