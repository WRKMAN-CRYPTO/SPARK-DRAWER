<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Magnet Rain</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#080a0f;touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#d9e3ef}
  canvas{display:block;width:100%;height:100%}
  .label{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top));font-size:11px;letter-spacing:.18em;opacity:.55;pointer-events:none}
  .hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:11px;letter-spacing:.1em;opacity:.45;pointer-events:none;transition:opacity .8s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">MAGNET RAIN</div>
<div class="hint" id="hint">DRAG YOUR FINGER THROUGH THE WEATHER</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),hint=document.getElementById('hint');
let W=0,H=0,D=1,t=0,px=innerWidth*.5,py=innerHeight*.58,tx=px,ty=py,down=false,used=false;
const drops=[],rings=[],sparks=[];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
function spawn(){drops.push({x:rnd(0,W),y:rnd(-80,-8),vx:rnd(-.25,.25),vy:rnd(.5,1.7),r:rnd(1.2,3.2),q:Math.random()<.5?-1:1,age:0})}
for(let i=0;i<55;i++){spawn();drops[i].y=rnd(0,H)}
function move(e){const p=e.touches?e.touches[0]:e;tx=p.clientX;ty=p.clientY;if(!used){used=true;hint.style.opacity=0}}
addEventListener('pointerdown',e=>{down=true;move(e);pulse(tx,ty)});addEventListener('pointermove',e=>{if(down)move(e)});addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);
function pulse(a,b){rings.push({x:a,y:b,r:8,a:.65})}
function buzz(n=8){if(navigator.vibrate)navigator.vibrate(n)}
function tick(){requestAnimationFrame(tick);t+=.016;px+=(tx-px)*.16;py+=(ty-py)*.16;
  if(drops.length<85 && Math.random()<.7)spawn();
  x.fillStyle='rgba(8,10,15,.28)';x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(px,py,0,px,py,145);g.addColorStop(0,'rgba(160,220,255,.08)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,145,0,7);x.fill();
  let caught=0;
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.age++;let dx=px-d.x,dy=py-d.y,dd=Math.hypot(dx,dy)||1;
    if(dd<190){const force=(1-dd/190)*(.18+(down?.22:.08));d.vx+=dx/dd*force;d.vy+=dy/dd*force;const twist=d.q*.035*(1-dd/190);d.vx+=-dy/dd*twist;d.vy+=dx/dd*twist}
    d.vy+=.012;d.vx*=.998;d.vy=Math.min(d.vy,3.3);d.x+=d.vx;d.y+=d.vy;
    if(dd<18){caught++;for(let k=0;k<3;k++)sparks.push({x:d.x,y:d.y,vx:rnd(-1.3,1.3),vy:rnd(-1.3,1.3),a:1});drops.splice(i,1);if(caught===1){pulse(px,py);buzz(5)};continue}
    if(d.y>H+20||d.x<-40||d.x>W+40){drops.splice(i,1);continue}
    const sp=Math.hypot(d.vx,d.vy);x.strokeStyle=`rgba(184,211,232,${Math.min(.7,.2+sp*.1)})`;x.lineWidth=d.r*.55;x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x-d.vx*2.5,d.y-d.vy*2.5);x.stroke();x.fillStyle='rgba(225,241,255,.7)';x.beginPath();x.arc(d.x,d.y,d.r,0,7);x.fill();
  }
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.96;s.vy*=.96;s.a-=.045;if(s.a<=0){sparks.splice(i,1);continue}x.fillStyle=`rgba(220,245,255,${s.a})`;x.fillRect(s.x,s.y,1.5,1.5)}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=2.4;r.a-=.025;if(r.a<=0){rings.splice(i,1);continue}x.strokeStyle=`rgba(180,230,255,${r.a})`;x.lineWidth=1;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()}
  x.save();x.translate(px,py);x.rotate(Math.sin(t*.7)*.05);x.strokeStyle='rgba(217,235,248,.8)';x.lineWidth=2;x.beginPath();x.arc(0,0,12,0,7);x.stroke();x.fillStyle='rgba(217,235,248,.08)';x.beginPath();x.arc(0,0,17+Math.sin(t*3)*1.5,0,7);x.fill();x.fillStyle='rgba(217,235,248,.75)';x.fillRect(-5,-2,10,4);x.restore();
}
tick();
</script>
</body>
</html>
