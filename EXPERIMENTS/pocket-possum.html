<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Possum</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1,p={x:0,y:0,vx:34,dir:1,dead:false,t:0},finger=null;function size(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);p.y=H*.72;if(!p.x)p.x=W*.5}size();onresize=size;function tap(e){let q=e.touches?e.touches[0]:e;finger={x:q.clientX,y:q.clientY,t:performance.now()};if(p.dead){p.dead=false;p.t=0;p.vx=(Math.random()<.5?-1:1)*34}}addEventListener('pointerdown',tap);function drawPossum(){x.save();x.translate(p.x,p.y);x.scale(p.dir,1);if(p.dead){x.rotate(Math.PI/2);x.fillStyle='#777';x.fillRect(-14,-7,28,14);x.fillStyle='#aaa';x.fillRect(8,-5,12,10);x.fillStyle='#f3b1b8';x.fillRect(19,-2,4,4);x.fillStyle='#222';x.fillRect(12,-3,2,2);x.fillRect(-17,-3,3,3);x.restore();return}let bob=Math.sin(p.t*9)*1.2;x.translate(0,bob);x.fillStyle='#777';x.fillRect(-15,-8,28,16);x.fillStyle='#aaa';x.fillRect(7,-6,13,12);x.fillStyle='#f3b1b8';x.fillRect(19,-2,5,4);x.fillRect(-18,-2,4,4);x.fillStyle='#eee';x.fillRect(11,-3,3,3);x.fillStyle='#111';x.fillRect(12,-3,1,1);x.fillStyle='#555';x.fillRect(-9,8,4,4);x.fillRect(7,8,4,4);x.fillStyle='#f3b1b8';x.fillRect(-20,-1,3,3);x.restore()}function loop(T){let dt=Math.min(.03,(T-(loop.last||T))/1000);loop.last=T;p.t+=dt;x.clearRect(0,0,W,H);x.fillStyle='#171717';x.fillRect(0,0,W,H);x.fillStyle='#252525';x.fillRect(0,H*.72+12,W,H);x.fillStyle='#444';for(let i=8;i<W;i+=37)x.fillRect(i,H*.72+18+(i%3)*4,2,2);if(!p.dead){if(finger&&T-finger.t<850){let dx=finger.x-p.x,dy=finger.y-p.y;if(Math.hypot(dx,dy)<95){p.dead=true;p.t=0;finger=null}}if(!p.dead){p.x+=p.vx*dt;p.dir=Math.sign(p.vx)||1;if(p.x>W-28){p.vx=-34}if(p.x<28){p.vx=34}if(Math.random()<dt*.22)p.vx*=-1}}drawPossum();if(p.dead&&p.t>2.4){x.font='12px monospace';x.textAlign='center';x.fillStyle='#666';x.fillText('...still dead.',p.x,p.y-31)}if(p.dead&&p.t>5.5){p.dead=false;p.vx=p.dir*34;p.t=0}requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
