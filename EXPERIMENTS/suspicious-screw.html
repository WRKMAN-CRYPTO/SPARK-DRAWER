<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Suspicious Screw</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121518;color:#e9edf0;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}
body{display:grid;place-items:center;background:
radial-gradient(circle at 50% 46%,#42494e 0 18%,#252a2e 47%,#121518 84%)}
#plate{position:relative;width:min(92vw,520px);aspect-ratio:1;border-radius:34px;background:
linear-gradient(135deg,#4b5358,#252a2e 47%,#3b4247);
box-shadow:inset 0 1px 2px #fff3,inset 0 -18px 35px #0008,0 24px 60px #000a;
border:1px solid #6c757b;overflow:hidden}
#plate:before{content:"";position:absolute;inset:14px;border:1px solid #ffffff12;border-radius:25px;pointer-events:none}
.rivet{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8b959a,#343a3e 55%,#111);box-shadow:0 2px 4px #0009}
.r1{left:23px;top:23px}.r2{right:23px;top:23px}.r3{left:23px;bottom:23px}.r4{right:23px;bottom:23px}
#brand{position:absolute;right:28px;bottom:24px;font:900 18px/1 Georgia,serif;opacity:.18;letter-spacing:-.08em;transform:rotate(-5deg)}
#title{position:absolute;left:0;right:0;top:25px;text-align:center;font:800 12px/1.2 Georgia,serif;letter-spacing:.18em;opacity:.72}
#hint{position:absolute;left:22px;right:22px;bottom:30px;text-align:center;font-size:11px;letter-spacing:.12em;opacity:.58}
#hole{position:absolute;left:50%;top:50%;width:146px;height:146px;transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle,#020303 0 49%,#111 50% 58%,#697277 59% 61%,#1b1f22 64%);
box-shadow:inset 0 14px 24px #000,0 2px 1px #ffffff18}
#tenant{position:absolute;left:50%;top:50%;width:96px;height:88px;transform:translate(-50%,-35%) scale(.2);opacity:0;transition:transform .18s ease-out,opacity .15s;
border-radius:48% 48% 40% 40%;background:#090b0c;box-shadow:0 -5px 18px #000}
.eye{position:absolute;top:29px;width:11px;height:11px;border-radius:50%;background:#d9f4c8;box-shadow:0 0 10px #baff86}
.eye.a{left:26px}.eye.b{right:26px}
#mouth{position:absolute;left:50%;top:52px;width:19px;height:7px;transform:translateX(-50%);border-bottom:2px solid #8aa27f;border-radius:50%}
#speech{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%) scale(.8);padding:7px 10px;border-radius:12px;background:#080a0be8;border:1px solid #ffffff1f;font:700 11px/1.1 system-ui;letter-spacing:.06em;opacity:0;pointer-events:none;transition:.16s;white-space:nowrap}
#screwWrap{position:absolute;left:50%;top:50%;width:176px;height:176px;transform:translate(-50%,-50%);display:grid;place-items:center;touch-action:none;cursor:grab}
#screwWrap:active{cursor:grabbing}
#screw{position:relative;width:132px;height:132px;border-radius:50%;
background:radial-gradient(circle at 34% 28%,#dce1e3 0 6%,#91999e 23%,#596166 58%,#2b3034 72%,#7b8489 74%,#40474b 84%);
box-shadow:0 13px 18px #000a,inset 0 2px 2px #fff7,inset 0 -5px 9px #0007;
transform:translateY(0) rotate(0deg);will-change:transform}
#screw:before,#screw:after{content:"";position:absolute;left:50%;top:50%;background:#202529;border-radius:4px;box-shadow:inset 0 2px 3px #000}
#screw:before{width:72px;height:17px;transform:translate(-50%,-50%)}
#screw:after{width:17px;height:72px;transform:translate(-50%,-50%)}
#depth{position:absolute;left:50%;top:calc(50% + 98px);transform:translateX(-50%);font:700 10px/1 monospace;letter-spacing:.08em;opacity:.48}
#reset{position:absolute;left:18px;top:18px;border:1px solid #ffffff22;background:#1118;color:#dde3e6;border-radius:999px;padding:8px 10px;font:700 10px/1 system-ui;letter-spacing:.08em}
#reset:active{transform:scale(.94)}
</style>
</head>
<body>
<div id="plate">
  <div class="rivet r1"></div><div class="rivet r2"></div><div class="rivet r3"></div><div class="rivet r4"></div>
  <button id="reset">RESET</button>
  <div id="title">SUSPICIOUS SCREW</div>
  <div id="brand">W</div>
  <div id="hole"></div>
  <div id="tenant"><i class="eye a"></i><i class="eye b"></i><i id="mouth"></i></div>
  <div id="speech">...</div>
  <div id="screwWrap" aria-label="Turn the screw">
    <div id="screw"></div>
  </div>
  <div id="depth">TIGHT</div>
  <div id="hint">drag around it · lefty loosey</div>
</div>
<script>
const wrap=document.querySelector('#screwWrap');
const screw=document.querySelector('#screw');
const tenant=document.querySelector('#tenant');
const speech=document.querySelector('#speech');
const depth=document.querySelector('#depth');
const reset=document.querySelector('#reset');
let turns=0,lastAngle=0,active=false,lastTick=-1,spoken=false,audio=null;

function angleFor(e){
  const r=wrap.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));
}
function blip(freq=220,dur=.025){
  try{
    audio ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(),g=audio.createGain();
    o.type='square';o.frequency.value=freq;g.gain.value=.035;
    o.connect(g);g.connect(audio.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur);
  }catch(_){}
}
function say(t,ms=900){
  speech.textContent=t;speech.style.opacity=1;speech.style.transform='translate(-50%,-50%) scale(1)';
  clearTimeout(say.t);say.t=setTimeout(()=>{speech.style.opacity=0;speech.style.transform='translate(-50%,-50%) scale(.8)'},ms);
}
function render(){
  const p=Math.max(0,Math.min(1,turns/2.75));
  const lift=p*58;
  screw.style.transform=`translateY(${-lift}px) rotate(${-turns*360}deg) scale(${1-p*.08})`;
  tenant.style.opacity=Math.max(0,(p-.48)*2.2);
  const rise=Math.max(0,(p-.45)/.55);
  tenant.style.transform=`translate(-50%,${-35-rise*30}%) scale(${.2+rise*.8})`;
  depth.textContent=p<.05?'TIGHT':p<.4?'...':p<.78?'THAT IS ODD':'VERY SUSPICIOUS';
  if(p>.82&&!spoken){spoken=true;say('hey.',1200);blip(130,.08)}
  if(p<.65)spoken=false;
}
wrap.addEventListener('pointerdown',e=>{
  active=true;lastAngle=angleFor(e);wrap.setPointerCapture(e.pointerId);blip(180);
});
wrap.addEventListener('pointermove',e=>{
  if(!active)return;
  const a=angleFor(e);let d=a-lastAngle;
  if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;
  lastAngle=a;
  turns=Math.max(0,Math.min(3.05,turns-d/(Math.PI*2)));
  const tick=Math.floor(turns*8);
  if(tick!==lastTick){lastTick=tick;blip(170+Math.min(90,turns*22))}
  render();
});
function end(){active=false}
wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
tenant.addEventListener('pointerdown',e=>{
  e.stopPropagation();
  const lines=['put that back.','rent is terrible up here.','I was sleeping.','no flashlight.','...you saw nothing.'];
  say(lines[Math.floor(Math.random()*lines.length)],1200);blip(110,.09);
});
reset.addEventListener('click',()=>{turns=0;spoken=false;lastTick=-1;render();say('clunk.',500);blip(150,.05)});
render();
</script>
</body>
</html>
