<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pocket Moon</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b12;touch-action:none}canvas{width:100%;height:100%;display:block}#note{position:fixed;left:0;right:0;bottom:18px;text-align:center;color:#8d94a8;font:12px system-ui;pointer-events:none;letter-spacing:.08em}
</style>
<canvas id="c"></canvas><div id="note">drag the moon. the tide is trying its best.</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,dpr,moon={x:.72,y:.24},drag=false,t=0;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
function pos(e){let p=e.touches?e.touches[0]:e;return{x:p.clientX/W,y:p.clientY/H}}
function down(e){let p=pos(e),dx=p.x-moon.x,dy=p.y-moon.y;if(dx*dx+dy*dy<.018)drag=true}
function move(e){if(!drag)return;let p=pos(e);moon.x=Math.max(.07,Math.min(.93,p.x));moon.y=Math.max(.07,Math.min(.62,p.y));e.preventDefault()}
function up(){drag=false}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);addEventListener('pointerup',up);c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);
function frame(){t+=.016;x.clearRect(0,0,W,H);let mx=moon.x*W,my=moon.y*H;
// stars
x.fillStyle='#777d91';for(let i=0;i<34;i++){let sx=(i*97%101)/101*W,sy=(i*53%67)/67*H*.62,a=.25+.35*Math.sin(t*.7+i);x.globalAlpha=a;x.fillRect(sx,sy,1,1)}x.globalAlpha=1;
// moon
let r=Math.max(18,Math.min(W,H)*.055),g=x.createRadialGradient(mx-r*.25,my-r*.3,2,mx,my,r);g.addColorStop(0,'#fffde9');g.addColorStop(1,'#bfc5d2');x.fillStyle=g;x.beginPath();x.arc(mx,my,r,0,7);x.fill();x.fillStyle='rgba(70,76,91,.18)';x.beginPath();x.arc(mx+r*.22,my-r*.1,r*.18,0,7);x.fill();x.beginPath();x.arc(mx-r*.25,my+r*.24,r*.12,0,7);x.fill();
// sea whose surface leans toward the moon
let base=H*.76,amp=Math.min(42,H*.07),pull=(.5-moon.y)*.55;x.fillStyle='#111b31';x.beginPath();x.moveTo(0,H);x.lineTo(0,base);for(let px=0;px<=W;px+=5){let q=px/W,near=Math.exp(-Math.pow(q-moon.x,2)/.035),wave=Math.sin(q*18+t*1.3)*4+Math.sin(q*37-t*.8)*2;let tide=-near*amp*(.35+moon.y*.65)+pull*amp*(q-.5);x.lineTo(px,base+tide+wave)}x.lineTo(W,H);x.closePath();x.fill();
// tiny boat, completely unaware of celestial mechanics
let bx=W*.28,q=bx/W,near=Math.exp(-Math.pow(q-moon.x,2)/.035),by=base-near*amp*(.35+moon.y*.65)+Math.sin(q*18+t*1.3)*4;x.save();x.translate(bx,by-4);x.rotate(Math.sin(t*1.3+q*18)*.05);x.fillStyle='#c6a77d';x.fillRect(-9,0,18,3);x.fillStyle='#d9dce5';x.fillRect(0,-12,1,12);x.beginPath();x.moveTo(1,-11);x.lineTo(9,-3);x.lineTo(1,-3);x.fill();x.restore();requestAnimationFrame(frame)}frame();
</script>
