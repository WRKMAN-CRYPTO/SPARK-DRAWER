<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Whisper Well</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07090d; touch-action: none; user-select: none; }
  canvas { display:block; width:100%; height:100%; }
  .hint {
    position: fixed; inset: auto 0 calc(env(safe-area-inset-bottom) + 18px) 0;
    text-align:center; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.18em; color:rgba(220,230,255,.24); pointer-events:none;
    transition: opacity 1.2s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">TOUCH THE WELL</div>
<script>
(() => {
  const c = document.querySelector('#c');
  const ctx = c.getContext('2d');
  const hint = document.querySelector('#hint');
  let W=0,H=0,D=1,t=0, last=performance.now(), touched=false;
  const motes=[];
  const ripples=[];
  const whispers=['hush','again','why','still','hello?','almost','maybe','there','listen','...','closer','gone'];

  function resize(){
    D=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    c.width=Math.floor(W*D); c.height=Math.floor(H*D);
    ctx.setTransform(D,0,0,D,0,0);
  }
  addEventListener('resize',resize,{passive:true}); resize();

  function drop(x,y){
    if(!touched){ touched=true; hint.style.opacity='0'; }
    const word=whispers[(Math.random()*whispers.length)|0];
    const ang=Math.random()*Math.PI*2;
    const speed=10+Math.random()*28;
    motes.push({
      x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
      word, age:0, life:7+Math.random()*9, phase:Math.random()*10,
      size:10+Math.random()*7
    });
    ripples.push({x,y,r:2,age:0,life:1.8});
  }

  c.addEventListener('pointerdown',e=>{
    c.setPointerCapture?.(e.pointerId);
    drop(e.clientX,e.clientY);
  });
  c.addEventListener('pointermove',e=>{
    if(e.buttons || e.pointerType==='touch'){
      if(Math.random()<0.18) drop(e.clientX,e.clientY);
    }
  });

  function step(now){
    const dt=Math.min((now-last)/1000,.035); last=now; t+=dt;
    ctx.clearRect(0,0,W,H);

    // The well is not drawn. It is only implied by what the whispers do.
    const cx=W/2, cy=H/2;
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.72);
    grd.addColorStop(0,'rgba(22,28,42,.72)');
    grd.addColorStop(.45,'rgba(9,12,19,.92)');
    grd.addColorStop(1,'rgba(4,5,8,1)');
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

    for(let i=ripples.length-1;i>=0;i--){
      const q=ripples[i]; q.age+=dt; q.r+=dt*(42+q.r*.55);
      const a=Math.max(0,1-q.age/q.life)*.18;
      ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(170,195,255,${a})`; ctx.lineWidth=1;
      ctx.stroke();
      if(q.age>q.life) ripples.splice(i,1);
    }

    for(let i=motes.length-1;i>=0;i--){
      const m=motes[i]; m.age+=dt;
      const dx=cx-m.x, dy=cy-m.y;
      const rr=Math.max(70,Math.hypot(dx,dy));
      // weak attraction plus a sideways curl
      const pull=1800/(rr*rr);
      m.vx += (dx/rr)*pull*dt*60 + (-dy/rr)*3.1*dt;
      m.vy += (dy/rr)*pull*dt*60 + ( dx/rr)*3.1*dt;
      m.vx*=Math.pow(.993,dt*60); m.vy*=Math.pow(.993,dt*60);
      m.x+=m.vx*dt; m.y+=m.vy*dt;

      const life=m.age/m.life;
      const fade=Math.sin(Math.min(1,life)*Math.PI);
      const wobble=Math.sin(t*1.7+m.phase)*1.5;
      ctx.save();
      ctx.translate(m.x,m.y+wobble);
      ctx.rotate(Math.atan2(m.vy,m.vx)*.08);
      ctx.font=`${m.size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=`rgba(212,224,255,${.08+.48*fade})`;
      ctx.shadowBlur=12; ctx.shadowColor=`rgba(120,160,255,${.18*fade})`;
      ctx.fillText(m.word,0,0);
      ctx.restore();

      if(m.age>m.life || m.x<-120 || m.x>W+120 || m.y<-120 || m.y>H+120) motes.splice(i,1);
    }

    // Occasionally the well answers without being touched.
    if(touched && Math.random()<dt*0.055){
      const a=Math.random()*Math.PI*2, r=45+Math.random()*85;
      drop(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    }

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
