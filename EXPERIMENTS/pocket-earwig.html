<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Earwig</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#d8d0bd;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}</style><canvas id="c"></canvas><script>const c=document.querySelector('#c'),x=c.getContext('2d');let w,h,d=devicePixelRatio||1;function size(){w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();let bug={x:w*.5,y:h*.55,a:0,v:0,panic:0},finger=null,t=0;function point(e){return{x:e.clientX,y:e.clientY}}addEventListener('pointerdown',e=>{finger=point(e);bug.panic=1.2});addEventListener('pointermove',e=>{if(finger)finger=point(e)});addEventListener('pointerup',()=>finger=null);function earwig(){x.save();x.translate(bug.x,bug.y);x.rotate(bug.a);x.scale(3,3);x.fillStyle='#33271d';x.strokeStyle='#49382a';x.lineWidth=1;x.beginPath();x.moveTo(8,-2);x.lineTo(14,-5);x.lineTo(19,-4);x.moveTo(8,2);x.lineTo(14,5);x.lineTo(19,4);x.stroke();for(let i=-4;i<=4;i+=4){let q=i/4;x.beginPath();x.moveTo(i,-3);x.lineTo(i-2+Math.sin(t*18+q)*2,-7);x.moveTo(i,3);x.lineTo(i-2+Math.cos(t*18+q)*2,7);x.stroke()}x.fillRect(-9,-3,16,6);x.fillStyle='#5a4431';for(let i=-7;i<7;i+=3)x.fillRect(i,-3,1,6);x.fillStyle='#2b2119';x.fillRect(6,-2,4,4);x.strokeStyle='#241a14';x.lineWidth=2;x.beginPath();x.moveTo(-9,-2);x.quadraticCurveTo(-15,-6,-18,-2);x.moveTo(-9,2);x.quadraticCurveTo(-15,6,-18,2);x.stroke();x.restore()}function loop(ms){let nt=ms/1000,dt=Math.min(.03,nt-t||.016);t=nt;let dx=0,dy=0;if(finger){dx=bug.x-finger.x;dy=bug.y-finger.y;let dist=Math.hypot(dx,dy);if(dist<150){bug.panic=Math.max(bug.panic,.8);dx/=dist||1;dy/=dist||1}}if(bug.panic>0){bug.panic-=dt;bug.v+=(220-bug.v)*dt*7;if(!finger){bug.a+=Math.sin(t*31)*dt*1.7}else{let target=Math.atan2(dy,dx);bug.a+=Math.atan2(Math.sin(target-bug.a),Math.cos(target-bug.a))*dt*10}}else{bug.v+=(22-bug.v)*dt*2;bug.a+=Math.sin(t*.8)*dt*.55}bug.x+=Math.cos(bug.a)*bug.v*dt;bug.y+=Math.sin(bug.a)*bug.v*dt;if(bug.x<18||bug.x>w-18){bug.a=Math.PI-bug.a;bug.x=Math.max(18,Math.min(w-18,bug.x))}if(bug.y<18||bug.y>h-18){bug.a=-bug.a;bug.y=Math.max(18,Math.min(h-18,bug.y))}x.fillStyle='#d8d0bd';x.fillRect(0,0,w,h);x.fillStyle='rgba(60,45,30,.08)';for(let i=0;i<18;i++)x.fillRect((i*83)%w,(i*137)%h,2,2);earwig();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
