<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Borrowed Shadow</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f2eadb;touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;height:100%}
  .label{position:fixed;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;pointer-events:none;color:#3c352d;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.68}
  .hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;pointer-events:none;color:#3c352d;font-size:11px;opacity:.42}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">BORROWED SHADOW</div>
<div class="hint">drag your finger · it learns badly</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let w=0,h=0,dpr=1,t=0,down=false,p={x:0,y:0},shadow={x:0,y:0,vx:0,vy:0},trail=[],ghostTrail=[];
let habit={curl:0.025,lag:18,bias:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!p.x){p.x=w*.5;p.y=h*.55;shadow.x=p.x;shadow.y=p.y+42}}
addEventListener('resize',resize);resize();
function pos(e){let q=e.touches?e.touches[0]:e;p.x=q.clientX;p.y=q.clientY}
function start(e){down=true;pos(e);habit.bias+=(Math.random()-.5)*.18;if(navigator.vibrate)navigator.vibrate(8)}
function move(e){if(down)pos(e)}
function end(){down=false}
c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);addEventListener('pointerup',end);addEventListener('pointercancel',end);
c.addEventListener('touchstart',e=>{e.preventDefault();start(e)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});c.addEventListener('touchend',end);
function drawHand(px,py){
  x.save();x.translate(px,py);x.fillStyle='#c76c48';x.beginPath();x.arc(0,0,12,0,Math.PI*2);x.fill();x.fillStyle='#6f4435';x.beginPath();x.arc(-3,-4,3,0,Math.PI*2);x.fill();x.restore();
}
function drawShadow(px,py,stretch){
  x.save();x.translate(px,py);x.rotate(Math.atan2(shadow.vy,shadow.vx)||0);x.scale(1+stretch*.8,1-stretch*.25);x.fillStyle='rgba(35,31,29,.84)';
  x.beginPath();x.ellipse(0,0,15,10,0,0,Math.PI*2);x.fill();
  x.beginPath();x.moveTo(-10,-4);x.quadraticCurveTo(-20,-15,-28,-5);x.quadraticCurveTo(-20,0,-11,2);x.fill();
  x.beginPath();x.moveTo(-10,4);x.quadraticCurveTo(-20,15,-28,5);x.quadraticCurveTo(-20,0,-11,-2);x.fill();
  x.fillStyle='#f2eadb';x.beginPath();x.arc(7,-2,1.5,0,Math.PI*2);x.fill();x.restore();
}
function step(){
  t++;
  trail.push({x:p.x,y:p.y});if(trail.length>90)trail.shift();
  let idx=Math.max(0,trail.length-habit.lag|0),target=trail[idx]||p;
  let dx=target.x-shadow.x,dy=target.y-shadow.y;
  let dist=Math.hypot(dx,dy)||1;
  let curl=(Math.sin(t*.045)+habit.bias)*habit.curl*dist;
  shadow.vx+=dx*.012-dy*curl*.004;shadow.vy+=dy*.012+dx*curl*.004;
  if(!down){shadow.vx+=Math.sin(t*.017)*.025;shadow.vy+=Math.cos(t*.021)*.025}
  shadow.vx*=.90;shadow.vy*=.90;shadow.x+=shadow.vx;shadow.y+=shadow.vy;
  if(shadow.x<18||shadow.x>w-18)shadow.vx*=-.8;if(shadow.y<40||shadow.y>h-18)shadow.vy*=-.8;
  ghostTrail.push({x:shadow.x,y:shadow.y});if(ghostTrail.length>55)ghostTrail.shift();
  x.clearRect(0,0,w,h);
  x.fillStyle='#f2eadb';x.fillRect(0,0,w,h);
  for(let i=0;i<ghostTrail.length;i+=3){let q=ghostTrail[i],a=i/ghostTrail.length*.12;x.fillStyle=`rgba(35,31,29,${a})`;x.beginPath();x.arc(q.x,q.y,2,0,7);x.fill()}
  if(down){x.strokeStyle='rgba(199,108,72,.16)';x.lineWidth=1.5;x.beginPath();let started=false;for(let i=Math.max(0,trail.length-35);i<trail.length;i++){let q=trail[i];if(!started){x.moveTo(q.x,q.y);started=true}else x.lineTo(q.x,q.y)}x.stroke()}
  let sp=Math.min(1,Math.hypot(shadow.vx,shadow.vy)/12);drawShadow(shadow.x,shadow.y,sp);drawHand(p.x,p.y);
  if(down&&dist<34){x.fillStyle='rgba(60,53,45,.35)';x.font='10px ui-monospace,monospace';x.textAlign='center';x.fillText('caught?',shadow.x,shadow.y-20)}
  requestAnimationFrame(step)
}
step();
</script>
</body>
</html>
