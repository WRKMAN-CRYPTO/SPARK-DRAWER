<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Nervous Nail</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d9c7a5;touch-action:none;font-family:ui-monospace,Menlo,monospace}
  canvas{display:block;width:100%;height:100%}
  .hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:#6f6049;font-size:12px;letter-spacing:.08em;opacity:.6;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="hint">tap the nail</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=0,H=0,D=1,last=performance.now();
let depth=.12,vel=0,wobble=0,panic=0,idle=0,escaped=false,flight=0,blink=0;
function size(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
function nailPos(){return {cx:W*.5, floor:H*.64}}
function tap(px,py){
  if(escaped){depth=.08;vel=0;wobble=0;panic=0;idle=0;escaped=false;flight=0;return}
  const {cx,floor}=nailPos();
  if(Math.hypot(px-cx,py-(floor-42*(1-depth)))<80){
    depth=Math.min(1,depth+.18); vel+=.02; wobble+=1.2; panic=Math.min(1,panic+.18); idle=0; blink=1;
    if(navigator.vibrate) navigator.vibrate(8);
  } else { wobble+=.25; idle=0; }
}
c.addEventListener('pointerdown',e=>tap(e.clientX,e.clientY));
function rect(px,py,w,h,col){x.fillStyle=col;x.fillRect(Math.round(px),Math.round(py),Math.round(w),Math.round(h))}
function drawNail(t){
  const {cx,floor}=nailPos();
  if(escaped){
    const q=Math.min(1,flight); const px=cx + Math.sin(q*9)*42*q; const py=floor-25 - q*H*.52 + 120*q*q;
    x.save();x.translate(px,py);x.rotate(Math.sin(q*18)*1.1);nailShape(0,0,.35);x.restore();return;
  }
  const exposed=1-depth;
  const bob=Math.sin(t*.006)*1.2*exposed;
  const rot=Math.sin(t*.045)*Math.min(.18,wobble*.04);
  x.save();x.translate(cx,floor+bob);x.rotate(rot);nailShape(0,0,exposed);x.restore();
}
function nailShape(cx,cy,exposed){
  const stemH=14+52*exposed;
  rect(cx-5,cy-stemH,10,stemH+4,'#6f7477');
  rect(cx-7,cy-stemH,4,stemH,'#9ba0a2');
  x.fillStyle='#575c5f';x.beginPath();x.moveTo(cx-5,cy+2);x.lineTo(cx+5,cy+2);x.lineTo(cx,cy+12);x.fill();
  rect(cx-20,cy-stemH-8,40,9,'#73787b');
  rect(cx-16,cy-stemH-11,32,4,'#aeb2b3');
  // tiny worried face only when enough of him is visible
  if(exposed>.42){
    const fy=cy-stemH+14;
    rect(cx-3,fy,2,2,'#303336'); rect(cx+5,fy,2,2,'#303336');
    if(blink<.12){rect(cx-3,fy,2,1,'#303336');rect(cx+5,fy,2,1,'#303336')}
    rect(cx+1,fy+6,3,1,'#3b3e40');
  }
}
function drawWood(){
  const floor=H*.64;
  rect(0,floor,W,H-floor,'#a97849');
  rect(0,floor,W,5,'#805b38');
  x.strokeStyle='rgba(79,49,27,.2)';x.lineWidth=2;
  for(let i=0;i<7;i++){const yy=floor+28+i*31;x.beginPath();x.moveTo(-20,yy);x.bezierCurveTo(W*.25,yy-10,W*.65,yy+12,W+20,yy-3);x.stroke()}
  // nail hole
  x.fillStyle='rgba(52,35,22,.45)';x.beginPath();x.ellipse(W*.5,floor+2,13,5,0,0,Math.PI*2);x.fill();
}
function update(dt){
  blink=Math.max(0,blink-dt*.0025);wobble*=Math.pow(.002,dt/1000);
  if(escaped){flight+=dt/1100;if(flight>1.25){escaped=false;depth=.04;idle=0;flight=0;panic=.1}return}
  idle+=dt;
  if(idle>900){
    const creep=(idle>2800? .000075:.000025)*dt;
    depth=Math.max(0,depth-creep);
    panic=Math.max(0,panic-dt*.00018);
  }
  // after being fully hammered, he waits... then quietly works himself free
  if(depth>.97 && idle>500){depth-=dt*.00004;wobble+=dt*.001}
  if(depth<.018 && idle>3600){escaped=true;flight=0;wobble=0}
}
function loop(t){const dt=Math.min(40,t-last);last=t;update(dt);x.clearRect(0,0,W,H);drawWood();drawNail(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
