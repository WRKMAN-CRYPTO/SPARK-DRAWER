<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Millipede</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#c9bea4;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style><canvas id=c></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),T=0,p=null;function fit(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}fit();onresize=fit;let h={x:W*.52,y:H*.5,a:.25,v:16},N=28,seg=Array.from({length:N},(_,i)=>({x:h.x-i*4,y:h.y}));onpointerdown=e=>p={x:e.clientX,y:e.clientY};onpointermove=e=>p&&(p={x:e.clientX,y:e.clientY});onpointerup=()=>p=null;function loop(ms){let n=ms/1000,dt=Math.min(.03,n-T||.016);T=n;if(p){let dx=h.x-p.x,dy=h.y-p.y,d=Math.hypot(dx,dy);if(d<115){let a=Math.atan2(dy,dx);h.a+=Math.atan2(Math.sin(a-h.a),Math.cos(a-h.a))*dt*6;h.v+=(55-h.v)*dt*5}else h.v+=(16-h.v)*dt*2}else{h.a+=Math.sin(T*.48)*dt*.42;h.v+=(16-h.v)*dt*2}h.x+=Math.cos(h.a)*h.v*dt;h.y+=Math.sin(h.a)*h.v*dt;if(h.x<25||h.x>W-25){h.a=Math.PI-h.a;h.x=Math.max(25,Math.min(W-25,h.x))}if(h.y<25||h.y>H-25){h.a=-h.a;h.y=Math.max(25,Math.min(H-25,h.y))}seg[0].x=h.x;seg[0].y=h.y;for(let i=1;i<N;i++){let dx=seg[i-1].x-seg[i].x,dy=seg[i-1].y-seg[i].y,d=Math.hypot(dx,dy)||1;seg[i].x+=dx/d*(d-4)*.72;seg[i].y+=dy/d*(d-4)*.72}g.fillStyle='#c9bea4';g.fillRect(0,0,W,H);g.fillStyle='rgba(60,48,32,.09)';for(let i=0;i<27;i++)g.fillRect((i*107)%W,(i*73)%H,2,2);for(let i=N-1;i>=0;i--){let a=i?Math.atan2(seg[i-1].y-seg[i].y,seg[i-1].x-seg[i].x):h.a;let wave=Math.sin(T*15-i*.72),swing=1.25+wave*1.8;g.strokeStyle='#514334';g.lineWidth=1;for(let pair=0;pair<2;pair++){let off=(pair-.5)*2.2;for(let side of [-1,1]){let bx=seg[i].x+Math.cos(a+Math.PI/2)*off,by=seg[i].y+Math.sin(a+Math.PI/2)*off;let ang=a+side*(1.48+swing*.12);g.beginPath();g.moveTo(bx,by);g.lineTo(bx+Math.cos(ang)*(5+swing),by+Math.sin(ang)*(5+swing));g.stroke()}}g.fillStyle=i%2?'#514536':'#5d4d3b';g.beginPath();g.arc(seg[i].x,seg[i].y,3.2,0,7);g.fill()}g.fillStyle='#44382c';g.beginPath();g.arc(h.x+Math.cos(h.a)*2,h.y+Math.sin(h.a)*2,4,0,7);g.fill();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
