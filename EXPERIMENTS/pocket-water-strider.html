<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Water Strider</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#8faeb0;touch-action:none}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),T=0,p=null,rings=[];function fit(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}fit();onresize=fit;let b={x:W*.5,y:H*.5,a:.4,v:9,burst:0};onpointerdown=e=>{p={x:e.clientX,y:e.clientY};rings.push({x:p.x,y:p.y,r:2,a:.7})};onpointermove=e=>{if(p)p={x:e.clientX,y:e.clientY}};onpointerup=()=>p=null;function foot(x,y){g.strokeStyle='rgba(235,245,238,.5)';g.beginPath();g.ellipse(x,y,7,2,0,0,7);g.stroke()}function draw(){g.save();g.translate(b.x,b.y);g.rotate(b.a);g.strokeStyle='#332d27';g.lineWidth=1.2;let kick=Math.sin(T*18)*3;let legs=[[-2,-2,-18,-13-kick],[-2,2,-18,13+kick],[3,-2,20,-15+kick],[3,2,20,15-kick]];for(const L of legs){g.beginPath();g.moveTo(L[0],L[1]);g.lineTo(L[2]*.55,L[3]*.55);g.lineTo(L[2],L[3]);g.stroke();foot(L[2],L[3])}g.fillStyle='#3e352d';g.beginPath();g.ellipse(0,0,9,2.7,0,0,7);g.fill();g.beginPath();g.arc(8,0,2.8,0,7);g.fill();g.strokeStyle='#40372e';g.beginPath();g.moveTo(9,-1);g.lineTo(16,-5);g.moveTo(9,1);g.lineTo(16,5);g.stroke();g.restore()}function loop(ms){let n=ms/1000,dt=Math.min(.03,n-T||.016);T=n;if(p){let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);if(d<120){let a=Math.atan2(dy,dx);b.a+=Math.atan2(Math.sin(a-b.a),Math.cos(a-b.a))*dt*12;b.burst=1}}if(b.burst>0){b.burst-=dt;b.v+=(125-b.v)*dt*12}else b.v+=(8-b.v)*dt*2;b.a+=Math.sin(T*.55)*dt*.25;b.x+=Math.cos(b.a)*b.v*dt;b.y+=Math.sin(b.a)*b.v*dt;if(b.x<25||b.x>W-25){b.a=Math.PI-b.a;b.x=Math.max(25,Math.min(W-25,b.x))}if(b.y<25||b.y>H-25){b.a=-b.a;b.y=Math.max(25,Math.min(H-25,b.y))}g.fillStyle='#8faeb0';g.fillRect(0,0,W,H);for(let y=10;y<H;y+=28){g.strokeStyle='rgba(255,255,255,.06)';g.beginPath();g.moveTo(0,y+Math.sin(T+y)*2);g.lineTo(W,y+Math.cos(T*.7+y)*2);g.stroke()}for(let i=rings.length-1;i>=0;i--){let z=rings[i];z.r+=45*dt;z.a-=.35*dt;g.strokeStyle=`rgba(240,250,245,${Math.max(0,z.a)})`;g.beginPath();g.arc(z.x,z.y,z.r,0,7);g.stroke();if(z.a<=0)rings.splice(i,1)}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
