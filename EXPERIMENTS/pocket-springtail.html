<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Springtail</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b18;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head><body><canvas id="c"></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,last=0,p={x:0,y:0,vx:0,vy:0,a:0,jump:0};function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(!p.x){p.x=W/2;p.y=H/2}}size();onresize=size;c.onpointerdown=e=>{let dx=p.x-e.clientX,dy=p.y-e.clientY,m=Math.hypot(dx,dy)||1;p.vx=dx/m*240;p.vy=dy/m*240;p.jump=.35};function draw(t){requestAnimationFrame(draw);let dt=Math.min(.03,(t-last)/1000||.016);last=t;g.clearRect(0,0,W,H);g.fillStyle='#242a24';for(let i=0;i<20;i++)g.fillRect((i*83)%W,(i*151)%H,1,1);p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.12,dt);p.vy*=Math.pow(.12,dt);if(p.x<10||p.x>W-10)p.vx*=-1;if(p.y<10||p.y>H-10)p.vy*=-1;p.x=Math.max(8,Math.min(W-8,p.x));p.y=Math.max(8,Math.min(H-8,p.y));if(Math.hypot(p.vx,p.vy)>3)p.a=Math.atan2(p.vy,p.vx);p.jump=Math.max(0,p.jump-dt);g.save();g.translate(p.x,p.y);g.rotate(p.a);let s=1+p.jump*1.4;g.scale(s,1/s);g.strokeStyle='#8e978b';g.lineWidth=1;for(let q of[-1,1])for(let i=0;i<3;i++){g.beginPath();g.moveTo(-1+i*2,q*2);g.lineTo(-4+i*2,q*5);g.stroke()}g.fillStyle='#687269';g.fillRect(-5,-2,8,4);g.fillStyle='#aab3a5';g.fillRect(3,-1,2,2);g.fillStyle='#111';g.fillRect(4,-1,1,1);g.restore()}requestAnimationFrame(draw)</script></body></html>
