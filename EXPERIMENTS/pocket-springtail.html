<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Springtail</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b18;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head><body><canvas id="c"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,last=0;
const p={x:0,y:0,a:0,state:'idle',clock:0,fromX:0,fromY:0,toX:0,toY:0,dirX:1,dirY:0,spin:0};
function size(){let d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);if(!p.x){p.x=W/2;p.y=H/2}}size();onresize=size;
function jumpAway(px,py){if(p.state==='air'||p.state==='crouch')return;let dx=p.x-px,dy=p.y-py,m=Math.hypot(dx,dy)||1;p.dirX=dx/m;p.dirY=dy/m;p.fromX=p.x;p.fromY=p.y;let dist=55+Math.random()*38;p.toX=Math.max(12,Math.min(W-12,p.x+p.dirX*dist));p.toY=Math.max(12,Math.min(H-12,p.y+p.dirY*dist));p.a=Math.atan2(p.dirY,p.dirX);p.state='crouch';p.clock=0}
c.onpointerdown=e=>jumpAway(e.clientX,e.clientY);
function bug(scaleX=1,scaleY=1,leg=0){g.save();g.translate(p.x,p.y);g.rotate(p.a);g.scale(scaleX,scaleY);g.strokeStyle='#8e978b';g.lineWidth=1;for(let q of[-1,1])for(let i=0;i<3;i++){let tuck=leg*2;g.beginPath();g.moveTo(-2+i*2,q*2);g.lineTo(-4+i*2+tuck,q*(5-leg*2));g.stroke()}g.fillStyle='#687269';g.fillRect(-5,-2,8,4);g.fillStyle='#aab3a5';g.fillRect(3,-1,2,2);g.fillStyle='#111';g.fillRect(4,-1,1,1);g.restore()}
function draw(t){requestAnimationFrame(draw);let dt=Math.min(.03,(t-last)/1000||.016);last=t;g.clearRect(0,0,W,H);g.fillStyle='#242a24';for(let i=0;i<20;i++)g.fillRect((i*83)%W,(i*151)%H,1,1);
if(p.state==='crouch'){p.clock+=dt;let u=Math.min(1,p.clock/.10);bug(1-u*.20,1+u*.25,u);if(u>=1){p.state='air';p.clock=0;p.spin=(Math.random()<.5?-1:1)*(1.0+Math.random()*.8)}}
else if(p.state==='air'){p.clock+=dt;let u=Math.min(1,p.clock/.36),ease=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;p.x=p.fromX+(p.toX-p.fromX)*ease;p.y=p.fromY+(p.toY-p.fromY)*ease;let height=Math.sin(Math.PI*u)*30;g.save();g.translate(0,-height);p.a+=p.spin*dt;bug(1,1,.8);g.restore();if(u>=1){p.x=p.toX;p.y=p.toY;p.state='land';p.clock=0}}
else if(p.state==='land'){p.clock+=dt;let u=Math.min(1,p.clock/.16);let squash=Math.sin(Math.PI*u);bug(1+squash*.25,1-squash*.32,1-u);if(u>=1){p.state='idle';p.clock=0}}
else{p.clock+=dt;let twitch=Math.sin(p.clock*2.7)*.02;bug(1+twitch,1-twitch,0)}
}
requestAnimationFrame(draw)</script></body></html>
