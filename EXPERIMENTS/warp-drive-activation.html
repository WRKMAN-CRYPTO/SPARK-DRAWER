<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Warp Drive Activation</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030507;color:#dbe8f1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:manipulation;user-select:none;-webkit-user-select:none}body{background:radial-gradient(circle at 50% 55%,#10202b 0,#05090d 38%,#020304 74%)}#wrap{position:fixed;inset:0;display:grid;place-items:center}button{width:150px;height:150px;border-radius:50%;border:1px solid #9fdcff66;background:radial-gradient(circle,#1b4e67 0,#0c2531 46%,#071218 72%);color:#e8f7ff;font-weight:800;letter-spacing:.15em;font-size:12px;box-shadow:0 0 0 1px #000 inset,0 0 40px #4eb8ef33;transition:.2s}button:active{transform:scale(.96)}#status{position:fixed;top:max(24px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:10px;letter-spacing:.22em;opacity:.5}#bar{position:fixed;bottom:max(34px,env(safe-area-inset-bottom));left:12%;right:12%;height:2px;background:#ffffff12;overflow:hidden}#fill{height:100%;width:0;background:#bde9ff;box-shadow:0 0 10px #8edcff}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.armed button{opacity:.25;filter:blur(.3px)}.done button{opacity:.75}</style></head><body><canvas id="c"></canvas><div id="wrap"><button id="go">ENGAGE</button></div><div id="status">WARP CORE IDLE</div><div id="bar"><div id="fill"></div></div><script>
const btn=document.querySelector('#go'),status=document.querySelector('#status'),fill=document.querySelector('#fill'),cv=document.querySelector('#c'),g=cv.getContext('2d');let ac,master,comp,reverbBuf,noiseBuf,W,H,D,anim=0,active=false,startT=0,flash=0;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function setup(){if(ac){ac.resume();return}ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=20;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.35;master.connect(comp).connect(ac.destination);noiseBuf=ac.createBuffer(1,ac.sampleRate*5,ac.sampleRate);let a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
function osc(type,f0,f1,t0,dur,vol,det=0,dest=master){let o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.detune.value=det;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t0+.03);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(gn).connect(dest);o.start(t0);o.stop(t0+dur+.05);return {o,gn}}
function noise(t0,dur,vol,lo=80,hi=12000){let s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.setValueAtTime(lo,t0);f.frequency.exponentialRampToValueAtTime(hi,t0+dur);f.Q.value=.7;gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+.08);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f).connect(gn).connect(master);s.start(t0);s.stop(t0+dur+.02)}
function pulse(t0,f=60,vol=.3,dur=.25){let o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*.55,t0+dur);gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(gn).connect(master);o.start(t0);o.stop(t0+dur)}
function chime(t0,f,vol=.04){osc('sine',f,f*1.002,t0,.9,vol);osc('triangle',f*2,f*2.004,t0,.65,vol*.25,7)}
function run(){if(active)return;setup();active=true;document.body.className='armed';btn.textContent='LOCKING';startT=performance.now();let t=ac.currentTime+.05;
// 0-2s: machinery wakes
pulse(t+.05,42,.22,.55);noise(t,.7,.02,70,420);osc('sine',38,52,t,.9,.14);osc('triangle',76,103,t+.18,.8,.05,-8);chime(t+.65,220,.025);
// 1-3.5s: field spins up, unevenly
for(let i=0;i<12;i++){let tt=t+.9+i*.19;let f=92*Math.pow(1.095,i);osc(i%3?'sawtooth':'triangle',f,f*1.06,tt,.22,.018+i*.002,(i%2?8:-8));if(i%3===0)pulse(tt,48+i*2,.09,.16)}
noise(t+1.2,2.0,.045,180,5000);osc('sine',55,110,t+1.15,2.1,.11);osc('sine',55.7,111.5,t+1.2,2.05,.08);
// 3.2-4.6s: harmonic lock, pressure build
[146.83,220,293.66,440].forEach((f,i)=>{osc('sine',f*.96,f*1.01,t+3.0+i*.08,1.45,.04+i*.008,(i-1.5)*5)});noise(t+3.15,1.3,.065,700,9000);for(let i=0;i<7;i++)pulse(t+3.35+i*.13,55+i*4,.11+i*.012,.1);
// 4.7s: the catch. low body + snap + wide upper tearing
let hit=t+4.72;pulse(hit,34,.62,1.25);pulse(hit+.018,68,.34,.62);pulse(hit+.045,136,.18,.35);noise(hit-.03,.3,.18,300,14000);osc('sawtooth',1800,140,hit-.04,.28,.09);osc('sine',28,46,hit,.95,.28);flash=1;
// post-hit: impossible engine hum then receding wake
osc('sine',46,43,hit+.12,2.7,.16);osc('sine',92,86,hit+.13,2.6,.07,9);osc('triangle',138,129,hit+.14,2.5,.035,-11);noise(hit+.1,2.1,.04,2500,480);for(let i=0;i<5;i++)chime(hit+.35+i*.23,660*Math.pow(.87,i),.018);
setTimeout(()=>{status.textContent='FIELD STABLE';btn.textContent='AGAIN';document.body.className='done';active=false},7800)}
btn.addEventListener('click',run);
function frame(){let e=active?(performance.now()-startT)/1000:0;g.clearRect(0,0,W,H);let cx=W/2,cy=H/2;if(active){let charge=Math.min(1,e/4.7),r=18+charge*120;g.strokeStyle=`rgba(150,220,255,${.08+.28*charge})`;g.lineWidth=1;for(let i=0;i<8;i++){let rr=r*(.3+i*.12)+Math.sin(e*8+i)*5;g.beginPath();g.arc(cx,cy,rr,0,Math.PI*2);g.stroke()}for(let i=0;i<36;i++){let a=i/36*Math.PI*2+e*(1.4+i%3*.2),len=10+charge*90*Math.random();g.strokeStyle=`rgba(180,230,255,${.025+.09*charge})`;g.beginPath();g.moveTo(cx+Math.cos(a)*r*.25,cy+Math.sin(a)*r*.25);g.lineTo(cx+Math.cos(a)*(r*.25+len),cy+Math.sin(a)*(r*.25+len));g.stroke()}fill.style.width=Math.min(100,e/4.72*100)+'%';if(e<.8)status.textContent='CORE WAKE';else if(e<3)status.textContent='FIELD BUILD';else if(e<4.5)status.textContent='HARMONIC LOCK';else status.textContent='SPACETIME SHEAR'}else fill.style.width='0';if(flash>0){g.fillStyle=`rgba(220,245,255,${flash})`;g.fillRect(0,0,W,H);flash*=.82}requestAnimationFrame(frame)}frame();
</script></body></html>
