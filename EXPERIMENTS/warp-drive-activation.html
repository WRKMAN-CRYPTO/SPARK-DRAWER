<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Warp Drive Activation</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030507;color:#dbe8f1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:manipulation;user-select:none;-webkit-user-select:none}body{background:radial-gradient(circle at 50% 55%,#10202b 0,#05090d 38%,#020304 74%)}#wrap{position:fixed;inset:0;display:grid;place-items:center}button{width:150px;height:150px;border-radius:50%;border:1px solid #9fdcff66;background:radial-gradient(circle,#1b4e67 0,#0c2531 46%,#071218 72%);color:#e8f7ff;font-weight:800;letter-spacing:.15em;font-size:12px;box-shadow:0 0 0 1px #000 inset,0 0 40px #4eb8ef33}button:active{transform:scale(.96)}#status{position:fixed;top:max(24px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:10px;letter-spacing:.22em;opacity:.5}#bar{position:fixed;bottom:max(34px,env(safe-area-inset-bottom));left:12%;right:12%;height:2px;background:#ffffff12;overflow:hidden}#fill{height:100%;width:0;background:#bde9ff;box-shadow:0 0 10px #8edcff}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.armed button{opacity:.22}.done button{opacity:.75}</style></head><body><canvas id="c"></canvas><div id="wrap"><button id="go">ENGAGE</button></div><div id="status">WARP CORE IDLE</div><div id="bar"><div id="fill"></div></div><script>
const btn=document.querySelector('#go'),status=document.querySelector('#status'),fill=document.querySelector('#fill'),cv=document.querySelector('#c'),g=cv.getContext('2d');let ac,master,comp,noiseBuf,W,H,D,active=false,startT=0,flash=0;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function setup(){if(ac){ac.resume();return}ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.78;comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=18;comp.ratio.value=7;comp.attack.value=.001;comp.release.value=.18;master.connect(comp).connect(ac.destination);noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);let a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
function osc(type,f0,f1,t0,dur,vol,det=0){let o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.detune.value=det;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+.008);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(gn).connect(master);o.start(t0);o.stop(t0+dur+.03)}
function noise(t0,dur,vol,lo,hi){let s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.setValueAtTime(lo,t0);f.frequency.exponentialRampToValueAtTime(hi,t0+dur);f.Q.value=.7;gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+.01);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f).connect(gn).connect(master);s.start(t0);s.stop(t0+dur+.02)}
function pulse(t0,f,vol,dur){let o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f*.46),t0+dur);gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(gn).connect(master);o.start(t0);o.stop(t0+dur)}
function run(){if(active)return;setup();active=true;document.body.className='armed';btn.textContent='LOCK';startT=performance.now();let t=ac.currentTime+.035;
// 0.00-.18: violent charge
pulse(t,46,.28,.18);noise(t,.18,.055,90,6000);osc('sawtooth',72,420,t,.18,.055,-9);osc('triangle',96,510,t+.015,.165,.04,11);
// .14-.40: harmonics race into alignment
[165,220,330,440,660].forEach((f,i)=>osc(i<2?'triangle':'sine',f*.72,f*1.02,t+.12+i*.025,.24,.028+i*.006,(i-2)*4));osc('sine',55,118,t+.12,.30,.14);osc('sine',56.2,121,t+.13,.29,.09,7);noise(t+.12,.28,.085,500,12000);
// .38-.52: pressure clicks into place
for(let i=0;i<4;i++)pulse(t+.35+i*.035,62+i*10,.12+i*.025,.08);
// .50: spacetime catches
let hit=t+.50;pulse(hit,32,.78,.72);pulse(hit+.009,64,.42,.38);pulse(hit+.018,128,.22,.22);noise(hit-.01,.16,.22,400,16000);osc('sawtooth',2400,150,hit-.012,.17,.13);osc('sine',27,44,hit,.55,.34);flash=1;
// .54-.75: engine exists, then the world is already gone
osc('sine',47,43,hit+.025,.24,.18);osc('sine',94,86,hit+.03,.22,.07,9);osc('triangle',141,130,hit+.034,.20,.035,-11);noise(hit+.02,.20,.045,3200,700);
setTimeout(()=>{status.textContent='FIELD STABLE';btn.textContent='AGAIN';document.body.className='done';active=false},820)}
btn.addEventListener('click',run);
function frame(){let e=active?(performance.now()-startT)/1000:0;g.clearRect(0,0,W,H);let cx=W/2,cy=H/2;if(active){let charge=Math.min(1,e/.5),r=16+charge*125;g.strokeStyle=`rgba(150,220,255,${.08+.34*charge})`;for(let i=0;i<8;i++){let rr=r*(.25+i*.13)+Math.sin(e*45+i)*4;g.beginPath();g.arc(cx,cy,rr,0,Math.PI*2);g.stroke()}fill.style.width=Math.min(100,e/.5*100)+'%';if(e<.13)status.textContent='CORE WAKE';else if(e<.32)status.textContent='FIELD BUILD';else if(e<.49)status.textContent='HARMONIC LOCK';else status.textContent='WARP'}else fill.style.width='0';if(flash>0){g.fillStyle=`rgba(225,248,255,${flash})`;g.fillRect(0,0,W,H);flash*=.68}requestAnimationFrame(frame)}frame();
</script></body></html>
