<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Weevil</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#d5cfbf;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style><canvas id="c"></canvas><script>const c=document.querySelector('#c'),g=c.getContext('2d');let w,h,d=devicePixelRatio||1,t=0,last=0,pointer=null;function size(){w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();const b={x:w*.5,y:h*.55,a:0,v:18,panic:0,step:0};addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};b.panic=1.1});addEventListener('pointermove',e=>{if(pointer)pointer={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>pointer=null);function leg(px,side,phase){const planted=Math.max(0,Math.sin(phase));const swing=Math.max(0,-Math.sin(phase));const reach=4+swing*2,back=planted*2;g.beginPath();g.moveTo(px,side*2);g.lineTo(px-2-back,side*(5+reach));g.lineTo(px-5-back,side*(7+reach*.45));g.stroke()}function bug(){const gait=b.step,hip=Math.sin(gait)*.7,bob=Math.abs(Math.sin(gait))*.35;g.save();g.translate(b.x,b.y);g.rotate(b.a+hip*.025);g.translate(0,bob);g.scale(3,3);g.fillStyle='#332a20';g.strokeStyle='#332a20';g.lineWidth=1;leg(-4,-1,gait);leg(0,-1,gait+Math.PI);leg(4,-1,gait);leg(-4,1,gait+Math.PI);leg(0,1,gait);leg(4,1,gait+Math.PI);g.fillRect(-8,-3,11,6);g.fillStyle='#514234';g.fillRect(-6,-2,8,4);g.fillStyle='#2a211a';g.fillRect(2,-2,4,4);g.fillRect(5,-1,7,2);g.fillRect(11,0,3,1);g.fillStyle='#111';g.fillRect(4,-2,1,1);g.fillRect(4,1,1,1);g.restore()}function loop(ms){t=ms/1000;let dt=Math.min(.03,(ms-last)/1000||.016);last=ms;if(pointer){let dx=b.x-pointer.x,dy=b.y-pointer.y,dist=Math.hypot(dx,dy);if(dist<140){b.panic=Math.max(b.panic,.7);let target=Math.atan2(dy,dx);b.a+=Math.atan2(Math.sin(target-b.a),Math.cos(target-b.a))*dt*9}}if(b.panic>0){b.panic-=dt;b.v+=(90-b.v)*dt*5}else{b.v+=(18-b.v)*dt*2;b.a+=Math.sin(t*.7)*dt*.35}const cadence=Math.max(.8,Math.min(19,2.5+b.v*.17));b.step+=dt*cadence;const pulse=.72+.28*Math.max(0,Math.sin(b.step));const side=Math.sin(b.step)*(.12*(b.panic?1.5:1));const forward=b.v*pulse*dt;b.x+=Math.cos(b.a)*forward-Math.sin(b.a)*side;b.y+=Math.sin(b.a)*forward+Math.cos(b.a)*side;if(b.x<18||b.x>w-18){b.a=Math.PI-b.a;b.x=Math.max(18,Math.min(w-18,b.x))}if(b.y<18||b.y>h-18){b.a=-b.a;b.y=Math.max(18,Math.min(h-18,b.y))}g.fillStyle='#d5cfbf';g.fillRect(0,0,w,h);g.fillStyle='rgba(50,40,30,.06)';for(let i=0;i<24;i++)g.fillRect((i*71)%w,(i*131)%h,1,1);bug();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
