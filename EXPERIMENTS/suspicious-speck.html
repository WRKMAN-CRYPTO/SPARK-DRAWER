<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><title>Suspicious Speck</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#efe9dc;touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.label{position:fixed;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;pointer-events:none;color:#302f2b;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.68}.hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;pointer-events:none;color:#302f2b;font-size:11px;opacity:.42}</style></head><body><canvas id="c"></canvas><div class="label">SUSPICIOUS SPECK</div><div class="hint">tap nearby · pretend you didn't</div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let w=0,h=0,dpr=1,t=0;let speck={x:0,y:0,vx:0,vy:0,mood:0,look:1,stare:0,hop:0};let taps=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);g.imageSmoothingEnabled=false;if(!speck.x){speck.x=w*.5;speck.y=h*.58}}addEventListener('resize',resize);resize();
function tap(e){let q=e.touches?e.touches[0]:e;let dx=q.clientX-speck.x,dy=q.clientY-speck.y,d=Math.hypot(dx,dy);taps.push({x:q.clientX,y:q.clientY,a:1});if(d<150){speck.mood=Math.min(1,speck.mood+.32);speck.stare=100;speck.look=dx<0?-1:1;if(d<56){speck.vx-=dx/(d||1)*1.6;speck.vy-=dy/(d||1)*1.6;speck.hop=10;if(navigator.vibrate)navigator.vibrate(7)}}}
c.addEventListener('pointerdown',tap);c.addEventListener('touchstart',e=>{e.preventDefault();tap(e)},{passive:false});
function p(x,y,s=5){g.fillRect(Math.round(x/s)*s,Math.round(y/s)*s,s,s)}
function drawSpeck(){const s=5,dir=speck.look;g.save();g.translate(Math.round(speck.x/s)*s,Math.round((speck.y-(speck.hop>0?5:0))/s)*s);g.scale(dir,1);g.fillStyle='#2e302c';g.fillRect(-5,-5,10,10);g.fillStyle='#efe9dc';g.fillRect(0,-5,5,5);if(speck.stare>0||speck.mood>.45){g.fillStyle='#2e302c';g.fillRect(0,-10,5,5)}if(speck.mood>.78){g.fillRect(-10,0,5,5)}g.restore()}
function update(){t++;speck.mood=Math.max(0,speck.mood-.003);if(speck.stare>0)speck.stare--;if(speck.hop>0)speck.hop--;if(speck.stare<=0){speck.vx+=Math.sin(t*.031)*.003;speck.vy+=Math.cos(t*.027)*.002}else{speck.vx*=.93;speck.vy*=.93}speck.vx*=.92;speck.vy*=.92;speck.x+=speck.vx;speck.y+=speck.vy;if(speck.x<18){speck.x=18;speck.vx=Math.abs(speck.vx)}if(speck.x>w-18){speck.x=w-18;speck.vx=-Math.abs(speck.vx)}if(speck.y<52){speck.y=52;speck.vy=Math.abs(speck.vy)}if(speck.y>h-28){speck.y=h-28;speck.vy=-Math.abs(speck.vy)}for(let i=taps.length-1;i>=0;i--){taps[i].a-=.04;if(taps[i].a<=0)taps.splice(i,1)}}
function draw(){g.fillStyle='#efe9dc';g.fillRect(0,0,w,h);for(const q of taps){g.fillStyle=`rgba(166,91,62,${q.a*.18})`;g.beginPath();g.arc(q.x,q.y,8+(1-q.a)*18,0,Math.PI*2);g.fill()}drawSpeck();if(speck.stare>48){g.fillStyle='rgba(46,48,44,.28)';g.font='10px ui-monospace,monospace';g.textAlign='center';g.fillText('...',speck.x,speck.y-22)}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
