<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Whip Scorpion</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#17130f;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style><canvas id=c></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),T=0,p=null;function fit(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}fit();onresize=fit;let q={x:W*.5,y:H*.55,a:0,v:10,alarm:0};onpointerdown=e=>p={x:e.clientX,y:e.clientY};onpointermove=e=>{if(p)p={x:e.clientX,y:e.clientY}};onpointerup=()=>p=null;function limb(x1,y1,x2,y2,x3,y3){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.stroke()}function draw(){g.save();g.translate(q.x,q.y);g.rotate(q.a);g.scale(2.5,2.5);g.strokeStyle='#8a765e';g.lineWidth=1.2;let s=Math.sin(T*15)*2;limb(-4,-3,-9,-9,-14+s,-12);limb(-1,-4,-4,-11,-8-s,-16);limb(3,-3,7,-9,12+s,-11);limb(-4,3,-9,9,-14-s,12);limb(-1,4,-4,11,-8+s,16);limb(3,3,7,9,12-s,11);g.fillStyle='#594936';g.beginPath();g.ellipse(0,0,8,5,0,0,7);g.fill();g.fillStyle='#756047';g.beginPath();g.ellipse(8,0,5,4,0,0,7);g.fill();/* huge feeler-legs, not antennae */g.strokeStyle='#a38a68';g.lineWidth=1;let f=Math.sin(T*2.7)*4;limb(9,-2,18,-9,29,-14+f);limb(9,2,18,9,29,14-f);/* absurdly thin whip tail */g.strokeStyle='#6d5b46';g.beginPath();g.moveTo(-7,0);for(let i=1;i<8;i++){let xx=-7-i*7,yy=Math.sin(T*3+i*.8)*i*.45;g.lineTo(xx,yy)}g.stroke();/* grasping pedipalps */g.strokeStyle='#9b8060';limb(8,-3,13,-6,16,-4);limb(8,3,13,6,16,4);g.restore()}function loop(ms){let n=ms/1000,dt=Math.min(.03,n-T||.016);T=n;if(p){let dx=q.x-p.x,dy=q.y-p.y,r=Math.hypot(dx,dy);if(r<150){q.alarm=1;let want=Math.atan2(dy,dx);q.a+=Math.atan2(Math.sin(want-q.a),Math.cos(want-q.a))*dt*8}}q.alarm=Math.max(0,q.alarm-dt*.8);q.v+=(q.alarm?95:13-q.v)*dt*4;q.a+=Math.sin(T*.6)*dt*.45;q.x+=Math.cos(q.a)*q.v*dt;q.y+=Math.sin(q.a)*q.v*dt;if(q.x<30||q.x>W-30){q.a=Math.PI-q.a;q.x=Math.max(30,Math.min(W-30,q.x))}if(q.y<30||q.y>H-30){q.a=-q.a;q.y=Math.max(30,Math.min(H-30,q.y))}g.fillStyle='#17130f';g.fillRect(0,0,W,H);g.fillStyle='#211c16';for(let i=0;i<30;i++)g.fillRect((i*89)%W,(i*131)%H,2,2);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
