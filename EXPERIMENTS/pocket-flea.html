<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Flea</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#e2ddcc;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#h{position:fixed;bottom:18px;width:100%;text-align:center;font:12px monospace;color:#777164;opacity:.7}</style></head><body><canvas id="c"></canvas><div id="h">try to touch him</div><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,S=4;function sz(){W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);c.width=W;c.height=H}sz();addEventListener('resize',sz);let f={x:W/2,y:H*.72,vx:0,vy:0,ground:H*.72,squash:0,t:50,face:1};function jump(away=0){if(f.y<f.ground-1)return;/* flea jump: almost all the drama is in the first instant */f.vy=-(5.8+Math.random()*1.4);f.vx=(away||(Math.random()<.5?-1:1))*(1.05+Math.random()*.55);f.face=Math.sign(f.vx);f.squash=0}addEventListener('pointerdown',e=>{let px=e.clientX/S,py=e.clientY/S;if(Math.hypot(px-f.x,py-f.y)<28)jump(Math.sign(f.x-px)||1)});function tick(){f.ground=H*.72;f.t--;if(f.y>=f.ground&&f.t<0){f.squash=4;f.t=40+Math.random()*100}if(f.squash){f.squash--;if(!f.squash)jump()}if(f.y<f.ground||f.vy<0){/* strong launch, ordinary-feeling gravity: ascent flashes by, descent hangs comparatively */f.vy+=.19;f.x+=f.vx;f.y+=f.vy;f.vx*=.994;if(f.y>=f.ground){f.y=f.ground;f.vy=0;f.vx=0}}if(f.x<5){f.x=5;f.vx=Math.abs(f.vx);f.face=1}if(f.x>W-5){f.x=W-5;f.vx=-Math.abs(f.vx);f.face=-1}}function px(x,y){g.fillRect(Math.round(x),Math.round(y),1,1)}function flea(){g.save();g.translate(Math.round(f.x),Math.round(f.y));g.scale(f.face,1);g.fillStyle='#332b25';let crouch=f.squash>0;if(crouch){g.fillRect(-2,-2,5,3);px(2,-3);px(-3,1);px(3,1);px(-4,2);px(4,2)}else{g.fillRect(-1,-4,3,5);g.fillRect(-2,-2,4,3);px(2,-4);px(-2,1);px(-3,2);px(-4,3);px(2,1);px(3,3);px(4,4)}g.restore()}function draw(){tick();g.fillStyle='#e2ddcc';g.fillRect(0,0,W,H);g.fillStyle='#c8c1ad';g.fillRect(0,Math.round(H*.72)+5,W,1);flea();requestAnimationFrame(draw)}draw()</script></body></html>
