<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>shy constellation</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060b;color:#cbd0e8;font-family:ui-monospace,monospace;touch-action:none}canvas{width:100%;height:100%;display:block}p{position:fixed;left:12px;bottom:8px;margin:0;font-size:11px;opacity:.55;pointer-events:none}
</style>
<canvas></canvas><p>the stars prefer not to be observed</p>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');
let w,h,d=Math.min(devicePixelRatio||1,2),pointer={x:-9999,y:-9999};
const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,phase:Math.random()*6.28}));
function size(){w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}size();addEventListener('resize',size);
function point(e){const q=e.touches?.[0]||e;pointer.x=q.clientX;pointer.y=q.clientY}
addEventListener('pointermove',point);addEventListener('pointerdown',point);addEventListener('touchmove',point,{passive:true});addEventListener('pointerleave',()=>pointer={x:-9999,y:-9999});
function frame(t){
 x.fillStyle='#05060b';x.fillRect(0,0,w,h);
 const visible=[];
 for(const s of stars){
  const sx=s.x*w,sy=s.y*h,dx=sx-pointer.x,dy=sy-pointer.y,dist=Math.hypot(dx,dy);
  const shy=Math.min(1,Math.max(0,(dist-45)/130));
  const twinkle=.65+.35*Math.sin(t*.0015+s.phase);
  const a=shy*twinkle;
  if(a>.08) visible.push([sx,sy,a]);
  x.beginPath();x.arc(sx,sy,s.r,0,7);x.fillStyle=`rgba(220,228,255,${a})`;x.fill();
 }
 // Constellations exist only where attention isn't looking.
 for(let i=0;i<visible.length;i++)for(let j=i+1;j<visible.length;j++){
  const [ax,ay,aa]=visible[i],[bx,by,ba]=visible[j],dd=Math.hypot(ax-bx,ay-by);
  if(dd<82){x.strokeStyle=`rgba(115,135,190,${(1-dd/82)*Math.min(aa,ba)*.22})`;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke()}
 }
 requestAnimationFrame(frame)
}requestAnimationFrame(frame);
</script>
