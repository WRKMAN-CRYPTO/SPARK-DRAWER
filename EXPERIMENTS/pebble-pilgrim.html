<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Pebble Pilgrim</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101116;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:#777b87;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;pointer-events:none;transition:opacity .8s}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="hint">tap somewhere worth going</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),hint=document.getElementById('hint');
let W=0,H=0,dpr=1,last=0,time=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

const bug={x:W*.5-18,y:H*.62,tx:W*.5,ty:H*.62,f:1,step:0,state:'idle',rest:0};
const rock={x:W*.5+7,y:H*.62+2,r:7,spin:0};
let dust=[];

function tap(x,y){
 hint.style.opacity=0;
 bug.tx=Math.max(24,Math.min(W-24,x));
 bug.ty=Math.max(35,Math.min(H-28,y));
 bug.state='push';bug.rest=0;
}
c.addEventListener('pointerdown',e=>tap(e.clientX,e.clientY));

function puff(x,y){
 if(Math.random()>.35)return;
 dust.push({x,y,vx:(Math.random()-.5)*13,vy:-4-Math.random()*10,a:.55,s:1+Math.random()*2});
}
function update(dt){
 time+=dt;
 dust.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*.7});
 dust=dust.filter(p=>p.a>0);
 if(bug.state==='push'){
   const dx=bug.tx-rock.x,dy=bug.ty-rock.y,d=Math.hypot(dx,dy);
   if(d>8){
     const nx=dx/d,ny=dy/d,sp=Math.min(63,23+d*.08);
     rock.x+=nx*sp*dt;rock.y+=ny*sp*dt;rock.spin+=sp*dt/rock.r;
     bug.x=rock.x-nx*18;bug.y=rock.y-ny*18;
     bug.f=nx<0?-1:1;bug.step+=dt*13;
     puff(rock.x-nx*6,rock.y-ny*6+5);
   }else{
     rock.x=bug.tx;rock.y=bug.ty;bug.state='admire';bug.rest=1.25;bug.step=0;
   }
 }else if(bug.state==='admire'){
   bug.rest-=dt;bug.step+=dt*3;
   if(bug.rest<=0){bug.state='idle';bug.tx=rock.x;bug.ty=rock.y;}
 }else{
   bug.step+=dt*2;
 }
}

function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function drawRock(){
 g.save();g.translate(Math.round(rock.x),Math.round(rock.y));g.rotate(rock.spin*.18);
 rect(-7,-6,14,12,'#6e706f');rect(-5,-8,8,3,'#858783');rect(4,-3,4,7,'#55585a');rect(-4,-4,3,3,'#9a9a91');
 g.restore();
}
function drawBug(){
 const s=3,bob=bug.state==='push'?Math.sin(bug.step)*1.5:Math.sin(bug.step)*.4;
 const X=Math.round(bug.x),Y=Math.round(bug.y+bob),f=bug.f,k=Math.sin(bug.step)>0?1:0;
 // tiny beetle: shell, head, eye, antennae, six unreasonable legs.
 rect(X-2*s,Y-2*s,4*s,3*s,'#b65a3c');
 rect(X-3*s,Y-1*s,2*s,2*s,'#742f2d');
 rect(X-3*s,Y-1*s,s,s,'#e8d8ad');
 rect(X-4*s,Y-2*s,s,s,'#c98968');rect(X-4*s,Y-3*s,1,s,'#c98968');
 for(let i=0;i<3;i++){
   const yy=Y-1*s+i*s;
   rect(X-1*s,yy,s,1+k,'#d09a72');
   rect(X+1*s,yy,s,2-k,'#d09a72');
 }
 if(bug.state==='admire'){
   rect(X+f*5*s,Y-4*s,1,3,'#8b8e9a');rect(X+f*5*s,Y-5*s,1,1,'#c8cbd4');
 }
}
function draw(){
 g.clearRect(0,0,W,H);
 g.globalAlpha=.23;
 for(let i=0;i<30;i++)rect((i*71)%W,H*.3+((i*41)%Math.max(1,H*.65)),1,1,'#666a75');
 g.globalAlpha=1;
 dust.forEach(p=>{g.globalAlpha=Math.max(0,p.a);rect(p.x,p.y,p.s,p.s,'#8a8170')});g.globalAlpha=1;
 drawRock();drawBug();
}
function loop(ms){const now=ms/1000,dt=Math.min(.033,now-last||.016);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body></html>
