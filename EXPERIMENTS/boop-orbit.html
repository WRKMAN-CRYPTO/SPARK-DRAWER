<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Boop Orbit</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#10131a;touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
canvas{display:block;width:100%;height:100%}
#title{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#d7deff;font-size:12px;letter-spacing:.2em;opacity:.7;pointer-events:none}
#hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#d7deff;font-size:11px;opacity:.4;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">BOOP ORBIT</div>
<div id="hint">tap the creature · it will overreact</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,dpr,tm=0;
let dude={x:0,y:0,vx:0,vy:0,r:18,panic:0,spin:0,blinks:0};
let moons=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!dude.x){dude.x=w/2;dude.y=h/2;for(let i=0;i<3;i++)moons.push({a:i*Math.PI*2/3,r:42+i*9,s:.018+(i*.004)})}}
addEventListener('resize',resize);resize();
function boop(px,py){let dx=dude.x-px,dy=dude.y-py,d=Math.hypot(dx,dy);if(d<70){let m=Math.max(5,90-d);let n=d||1;dude.vx+=dx/n*m*.18+(Math.random()-.5)*4;dude.vy+=dy/n*m*.18+(Math.random()-.5)*4;dude.panic=1;dude.spin+=(Math.random()-.5)*.8;dude.blinks=8;if(navigator.vibrate)navigator.vibrate(10)}else{dude.vx+=(px-dude.x)*.002;dude.vy+=(py-dude.y)*.002}}
c.addEventListener('pointerdown',e=>boop(e.clientX,e.clientY));
function blob(){
  const speed=Math.hypot(dude.vx,dude.vy),squash=Math.min(.35,speed*.025);
  ctx.save();ctx.translate(dude.x,dude.y);ctx.rotate(dude.spin);ctx.scale(1+squash,1-squash*.6);
  ctx.fillStyle='#ffd166';ctx.beginPath();ctx.ellipse(0,0,18,15,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2c2c34';
  let blink=dude.blinks>0 && dude.blinks%3===0;
  if(blink){ctx.fillRect(-7,-3,5,1);ctx.fillRect(3,-3,5,1)}else{ctx.beginPath();ctx.arc(-5,-3,2.2,0,7);ctx.arc(6,-3,2.2,0,7);ctx.fill()}
  ctx.strokeStyle='#2c2c34';ctx.lineWidth=1.8;ctx.beginPath();
  if(dude.panic>.4){ctx.arc(1,5,3,0,Math.PI)}else{ctx.arc(1,3,4,.15,Math.PI-.15)}ctx.stroke();
  ctx.restore();
}
function step(){tm++;
  dude.vx*=.985;dude.vy*=.985;dude.x+=dude.vx;dude.y+=dude.vy;dude.spin*=.96;dude.panic*=.965;if(dude.blinks>0)dude.blinks--;
  if(dude.x<25){dude.x=25;dude.vx=Math.abs(dude.vx)*.82;dude.panic=.8}
  if(dude.x>w-25){dude.x=w-25;dude.vx=-Math.abs(dude.vx)*.82;dude.panic=.8}
  if(dude.y<55){dude.y=55;dude.vy=Math.abs(dude.vy)*.82;dude.panic=.8}
  if(dude.y>h-25){dude.y=h-25;dude.vy=-Math.abs(dude.vy)*.82;dude.panic=.8}
  ctx.clearRect(0,0,w,h);
  for(let i=0;i<70;i++){let sx=(i*97)%w,sy=(i*53)%h,tw=.25+.25*Math.sin(tm*.02+i);ctx.fillStyle=`rgba(210,220,255,${tw})`;ctx.fillRect(sx,sy,1,1)}
  moons.forEach((m,i)=>{m.a+=m.s*(1+dude.panic*1.8);let rr=m.r+Math.sin(tm*.03+i)*2,px=dude.x+Math.cos(m.a)*rr,py=dude.y+Math.sin(m.a)*rr;ctx.fillStyle=i===0?'#8ecae6':i===1?'#bdb2ff':'#ffafcc';ctx.beginPath();ctx.arc(px,py,5+i,0,7);ctx.fill();});
  blob();
  if(dude.panic>.65){ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='10px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText('RUDE',dude.x,dude.y-30)}
  requestAnimationFrame(step)}
step();
</script>
</body>
</html>
