<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Pocket Storm</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;height:100%}
  #hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:#bfd5efaa;font-size:13px;letter-spacing:.08em;pointer-events:none;transition:opacity .5s}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="hint">rub the sky • release the storm</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),hint=document.querySelector('#hint');
let W=0,H=0,dpr=1,t=0,down=false,last=null,charge=0,flash=0,stormCount=0;
const clouds=[],rain=[],flowers=[],sparks=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
function pointer(e){return {x:e.clientX,y:e.clientY}}
function puff(px,py,vx=0,vy=0){clouds.push({x:px,y:py,r:rnd(18,38),vx:vx+rnd(-.2,.2),vy:vy+rnd(-.12,.12),life:rnd(120,230),q:rnd(.2,1)})}
function rub(p){if(!last){last=p;return}let dx=p.x-last.x,dy=p.y-last.y,s=Math.hypot(dx,dy);charge=Math.min(100,charge+s*.24);if(s>5) puff(p.x+rnd(-12,12),p.y+rnd(-8,8),dx*.018,dy*.018);last=p}
function storm(px,py){stormCount++;hint.style.opacity=0;let power=.35+.65*(charge/100);flash=1;for(let i=0;i<18+power*60;i++)rain.push({x:px+rnd(-90,90),y:py+rnd(-30,20),vx:rnd(-.35,.35),vy:rnd(5,9)+power*5,l:rnd(7,18),life:rnd(35,75)});let bx=px,by=py;for(let i=0;i<11;i++){let nx=bx+rnd(-28,28),ny=by+rnd(22,52);sparks.push({x1:bx,y1:by,x2:nx,y2:ny,life:9});bx=nx;by=ny}for(let i=0;i<Math.ceil(power*3);i++)flowers.push({x:px+rnd(-85,85),y:H+rnd(0,20),h:0,target:rnd(26,72),phase:rnd(0,9),petals:Math.floor(rnd(4,8))});charge=0;last=null}
addEventListener('pointerdown',e=>{down=true;last=pointer(e);rub(last)});
addEventListener('pointermove',e=>{if(down)rub(pointer(e))});
addEventListener('pointerup',e=>{if(down){down=false;storm(e.clientX,e.clientY)}});
addEventListener('pointercancel',()=>{down=false;last=null});
function drawSky(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,flash>.1?'#526d98':'#07111f');g.addColorStop(1,'#14283a');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffffff';for(let i=0;i<30;i++){let sx=(i*83.7)%W,sy=(i*47.3)%(H*.55);let a=.12+.12*Math.sin(t*.01+i);x.globalAlpha=a;x.fillRect(sx,sy,1.2,1.2)}x.globalAlpha=1}
function drawClouds(){for(let i=clouds.length-1;i>=0;i--){let a=clouds[i];a.x+=a.vx;a.y+=a.vy;a.life--;a.r*=1.001;x.beginPath();x.arc(a.x,a.y,a.r,0,Math.PI*2);x.fillStyle=`rgba(${80+charge},${105+charge*.7},${135+charge*.45},${Math.max(0,Math.min(.24,a.life/120*.2))})`;x.fill();if(a.life<=0)clouds.splice(i,1)}}
function drawRain(){x.lineCap='round';for(let i=rain.length-1;i>=0;i--){let a=rain[i];a.x+=a.vx;a.y+=a.vy;a.life--;x.strokeStyle='rgba(154,205,255,.55)';x.lineWidth=1.2;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(a.x-a.vx*2,a.y-a.l);x.stroke();if(a.y>H||a.life<=0)rain.splice(i,1)}}
function drawLightning(){for(let i=sparks.length-1;i>=0;i--){let a=sparks[i];a.life--;x.strokeStyle=`rgba(235,247,255,${a.life/9})`;x.lineWidth=a.life>6?4:1.5;x.beginPath();x.moveTo(a.x1,a.y1);x.lineTo(a.x2,a.y2);x.stroke();if(a.life<=0)sparks.splice(i,1)}}
function drawFlowers(){for(const f of flowers){f.h+=(f.target-f.h)*.035;let sway=Math.sin(t*.025+f.phase)*3;x.strokeStyle='#7aa86d';x.lineWidth=2;x.beginPath();x.moveTo(f.x,H);x.quadraticCurveTo(f.x+sway,H-f.h*.55,f.x+sway,H-f.h);x.stroke();let cy=H-f.h,cx=f.x+sway;for(let j=0;j<f.petals;j++){let a=j/f.petals*Math.PI*2;x.fillStyle=`hsl(${(stormCount*47+j*9)%360} 70% 68%)`;x.beginPath();x.arc(cx+Math.cos(a)*5,cy+Math.sin(a)*5,3.5,0,Math.PI*2);x.fill()}x.fillStyle='#f3cf69';x.beginPath();x.arc(cx,cy,3,0,Math.PI*2);x.fill()}}
function drawCharge(){if(!down||!last)return;x.strokeStyle=`rgba(200,230,255,${.2+charge/130})`;x.lineWidth=2;x.beginPath();x.arc(last.x,last.y,18+charge*.35,0,Math.PI*2);x.stroke();x.fillStyle='#d8efff';x.font='12px ui-monospace,monospace';x.textAlign='center';x.fillText(Math.round(charge)+'%',last.x,last.y-28-charge*.2)}
function loop(){t++;flash*=.82;drawSky();drawFlowers();drawClouds();drawRain();drawLightning();drawCharge();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
