<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Centipede</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#c8c0aa;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style><canvas id=c></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),T=0,p=null;function fit(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}fit();onresize=fit;let head={x:W*.5,y:H*.5,a:0,s:28},pts=Array.from({length:18},(_,i)=>({x:head.x-i*5,y:head.y}));onpointerdown=e=>p={x:e.clientX,y:e.clientY};onpointermove=e=>{if(p)p={x:e.clientX,y:e.clientY}};onpointerup=()=>p=null;function loop(ms){let n=ms/1000,dt=Math.min(.03,n-T||.016);T=n;if(p){let dx=head.x-p.x,dy=head.y-p.y,r=Math.hypot(dx,dy);if(r<130){let a=Math.atan2(dy,dx);head.a+=Math.atan2(Math.sin(a-head.a),Math.cos(a-head.a))*dt*9;head.s+=(150-head.s)*dt*7}else head.s+=(28-head.s)*dt*3}else{head.a+=Math.sin(T*.85)*dt*.7;head.s+=(28-head.s)*dt*3}head.x+=Math.cos(head.a)*head.s*dt;head.y+=Math.sin(head.a)*head.s*dt;if(head.x<20||head.x>W-20){head.a=Math.PI-head.a;head.x=Math.max(20,Math.min(W-20,head.x))}if(head.y<20||head.y>H-20){head.a=-head.a;head.y=Math.max(20,Math.min(H-20,head.y))}pts[0].x=head.x;pts[0].y=head.y;for(let i=1;i<pts.length;i++){let a=Math.atan2(pts[i-1].y-pts[i].y,pts[i-1].x-pts[i].x),dist=Math.hypot(pts[i-1].x-pts[i].x,pts[i-1].y-pts[i].y);pts[i].x+=Math.cos(a)*(dist-5)*.8;pts[i].y+=Math.sin(a)*(dist-5)*.8}g.fillStyle='#c8c0aa';g.fillRect(0,0,W,H);g.fillStyle='rgba(55,45,30,.1)';for(let i=0;i<25;i++)g.fillRect((i*103)%W,(i*67)%H,2,2);g.lineCap='round';for(let i=pts.length-1;i>=0;i--){let a=i?Math.atan2(pts[i-1].y-pts[i].y,pts[i-1].x-pts[i].x):head.a,phase=T*22-i*.85,spread=7+Math.sin(phase)*2;g.strokeStyle='#594532';g.lineWidth=1.3;g.beginPath();g.moveTo(pts[i].x,pts[i].y);g.lineTo(pts[i].x+Math.cos(a+1.65)*spread,pts[i].y+Math.sin(a+1.65)*spread);g.moveTo(pts[i].x,pts[i].y);g.lineTo(pts[i].x+Math.cos(a-1.65)*spread,pts[i].y+Math.sin(a-1.65)*spread);g.stroke();g.fillStyle=i%2?'#755a3d':'#654b34';g.beginPath();g.arc(pts[i].x,pts[i].y,i?3.1:4,0,7);g.fill()}let hx=head.x+Math.cos(head.a)*4,hy=head.y+Math.sin(head.a)*4;g.strokeStyle='#5b4735';g.beginPath();g.moveTo(hx,hy);g.lineTo(hx+Math.cos(head.a-.5)*10,hy+Math.sin(head.a-.5)*10);g.moveTo(hx,hy);g.lineTo(hx+Math.cos(head.a+.5)*10,hy+Math.sin(head.a+.5)*10);g.stroke();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
