<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Thumb Moth</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a12;touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;height:100%}
  .label{position:fixed;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;color:#d7d4ff88;font-size:12px;letter-spacing:.18em;pointer-events:none;text-transform:uppercase}
  .hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;color:#d7d4ff55;font-size:11px;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">thumb moth</div>
<div class="hint" id="hint">drag slowly. it likes the light.</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),hint=document.getElementById('hint');
let w=0,h=0,dpr=1,t=0,px=innerWidth*.5,py=innerHeight*.65,active=false,lastMove=0;
const stars=[],dust=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);stars.length=0;for(let i=0;i<80;i++)stars.push({x:Math.random()*w,y:Math.random()*h,a:.08+Math.random()*.3,r:.3+Math.random()*1.1});}
addEventListener('resize',resize);resize();
const moth={x:w*.5,y:h*.42,vx:0,vy:0,a:0,flap:0,trust:0};
function pointer(e){const p=e.touches?e.touches[0]:e;px=p.clientX;py=p.clientY;active=true;lastMove=performance.now();hint.style.opacity=0;}
addEventListener('pointerdown',pointer,{passive:false});addEventListener('pointermove',pointer,{passive:false});
addEventListener('touchstart',pointer,{passive:false});addEventListener('touchmove',pointer,{passive:false});
addEventListener('pointerup',()=>active=false);addEventListener('touchend',()=>active=false);
function softGlow(cx,cy,r,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(255,242,170,${a})`);g.addColorStop(.25,`rgba(197,176,255,${a*.45})`);g.addColorStop(1,'rgba(100,90,180,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();}
function wing(side,flap){x.save();x.scale(side,1);x.rotate(side*flap*.18);x.beginPath();x.moveTo(2,-3);x.quadraticCurveTo(25,-25,32,-6);x.quadraticCurveTo(27,12,4,8);x.closePath();x.fillStyle='rgba(185,177,255,.28)';x.fill();x.strokeStyle='rgba(231,226,255,.35)';x.lineWidth=1;x.stroke();x.restore();}
function drawMoth(){x.save();x.translate(moth.x,moth.y);x.rotate(moth.a+Math.PI/2);const f=Math.sin(moth.flap);wing(-1,f);wing(1,f);x.fillStyle='#e8e3ff';x.beginPath();x.ellipse(0,1,3,10,0,0,Math.PI*2);x.fill();x.fillStyle='#fff8c9';x.beginPath();x.arc(0,-8,3.1,0,Math.PI*2);x.fill();x.strokeStyle='rgba(255,248,201,.7)';x.lineWidth=.8;x.beginPath();x.moveTo(-1,-10);x.quadraticCurveTo(-7,-17,-10,-15);x.moveTo(1,-10);x.quadraticCurveTo(7,-17,10,-15);x.stroke();x.restore();softGlow(moth.x,moth.y,28,.12+.12*moth.trust);}
function frame(ms){requestAnimationFrame(frame);const dt=Math.min((ms-t||16)/16.67,2);t=ms;x.clearRect(0,0,w,h);x.fillStyle='#090a12';x.fillRect(0,0,w,h);
 for(const s of stars){x.fillStyle=`rgba(220,218,255,${s.a})`;x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();}
 const idle=ms-lastMove>1200;if(active||!idle)softGlow(px,py,72,.26);
 const dx=px-moth.x,dy=py-moth.y,dist=Math.hypot(dx,dy)||1;let pull=(active||!idle)?Math.min(.06,18/dist*.03):.004;
 if(dist<38)pull*=-.35; moth.vx+=dx/dist*pull*dt; moth.vy+=dy/dist*pull*dt; moth.vx+=Math.sin(ms*.0023)*.004; moth.vy+=Math.cos(ms*.0017)*.003;
 moth.vx*=Math.pow(.986,dt);moth.vy*=Math.pow(.986,dt);const sp=Math.hypot(moth.vx,moth.vy);if(sp>3){moth.vx*=3/sp;moth.vy*=3/sp;}
 moth.x+=moth.vx*dt;moth.y+=moth.vy*dt;if(moth.x<20||moth.x>w-20)moth.vx*=-1;if(moth.y<35||moth.y>h-20)moth.vy*=-1;moth.x=Math.max(15,Math.min(w-15,moth.x));moth.y=Math.max(30,Math.min(h-15,moth.y));
 if(sp>.05)moth.a=Math.atan2(moth.vy,moth.vx);moth.flap+=dt*(.16+sp*.13);moth.trust+=(dist<80?.012:-.002)*dt;moth.trust=Math.max(0,Math.min(1,moth.trust));
 if((active||!idle)&&Math.random()<.28){dust.push({x:px+(Math.random()-.5)*16,y:py+(Math.random()-.5)*16,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,life:1});}
 for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.x+=d.vx;d.y+=d.vy-.05;d.life-=.012; x.fillStyle=`rgba(255,244,177,${Math.max(0,d.life)*.65})`;x.beginPath();x.arc(d.x,d.y,1.2,0,Math.PI*2);x.fill();if(d.life<=0)dust.splice(i,1);}
 drawMoth();
 if(moth.trust>.88&&dist<95){x.fillStyle=`rgba(255,245,190,${.12+.08*Math.sin(ms*.004)})`;x.font='11px ui-monospace,monospace';x.textAlign='center';x.fillText('it knows you now',w/2,h*.82);}
}
requestAnimationFrame(frame);
</script>
</body>
</html>
