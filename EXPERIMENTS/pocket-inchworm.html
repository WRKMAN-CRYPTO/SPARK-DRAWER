<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Inchworm</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e8e1cc;touch-action:none}canvas{width:100%;height:100%;image-rendering:pixelated}</style><canvas id="c"></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,d=4,t=0,tx,ty,phase=0,rest=0;function size(){W=c.width=innerWidth*d;H=c.height=innerHeight*d;x.imageSmoothingEnabled=false;if(tx==null){tx=W*.5;ty=H*.58}}size();addEventListener('resize',size);let p={x:0,y:0};function target(e){let r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;tx=(q.clientX-r.left)*d;ty=(q.clientY-r.top)*d;rest=0}addEventListener('pointerdown',target);addEventListener('pointermove',e=>{if(e.buttons)target(e)});function dot(a,b,s=14){x.fillRect(Math.round(a/s)*s,Math.round(b/s)*s,s,s)}function loop(){requestAnimationFrame(loop);t++;x.fillStyle='#e8e1cc';x.fillRect(0,0,W,H);x.fillStyle='#c8b995';for(let i=0;i<35;i++)dot((i*173)%W,(i*311)%H,5);let dx=tx-p.x,dy=ty-p.y,L=Math.hypot(dx,dy);if(!p.x){p.x=W*.35;p.y=H*.55}let ux=dx/(L||1),uy=dy/(L||1),nx=-uy,ny=ux;if(L>45){phase+=.09;if(phase>Math.PI*2){phase=0;p.x+=ux*38;p.y+=uy*38}}else rest++;let bunch=(1-Math.cos(phase))*.5,spacing=22-11*bunch,arch=30*bunch;let seg=[];for(let i=0;i<6;i++){let back=(5-i)*spacing,a=p.x-ux*back+nx*Math.sin(i/5*Math.PI)*arch,b=p.y-uy*back+ny*Math.sin(i/5*Math.PI)*arch;seg.push([a,b])}x.fillStyle='#55733b';for(let q of seg)dot(q[0],q[1],18);let h=seg[5];x.fillStyle='#34472a';dot(h[0]+ux*9+nx*5,h[1]+uy*9+ny*5,5);if(rest>100&&rest%180<45){x.fillStyle='#55733b';dot(h[0]+nx*13,h[1]+ny*13,7)}x.fillStyle='#766b50';x.font='48px monospace';x.textAlign='center';x.fillText(L>45?'inching...':rest>100?'?':'...',W/2,H*.16)}loop()</script>
