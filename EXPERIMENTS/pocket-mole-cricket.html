<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Mole Cricket</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#8b6846;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}</style><canvas id=c></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),T=0,p=null,crumb=[];function fit(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}fit();onresize=fit;let b={x:W*.5,y:H*.5,a:.2,v:7,dig:0};onpointerdown=e=>p={x:e.clientX,y:e.clientY};onpointermove=e=>p&&(p={x:e.clientX,y:e.clientY});onpointerup=()=>p=null;function draw(){g.save();g.translate(b.x,b.y);g.rotate(b.a);g.scale(2.8,2.8);g.fillStyle='#3b2b1f';g.beginPath();g.ellipse(-2,0,9,4,0,0,7);g.fill();g.fillStyle='#51402e';g.beginPath();g.ellipse(7,0,5,4,0,0,7);g.fill();g.strokeStyle='#2e2118';g.lineWidth=1.2;let scoop=Math.sin(T*22)*3;/* shovel forelegs */for(let s of [-1,1]){g.beginPath();g.moveTo(5,s*3);g.lineTo(11,s*(7+scoop*.18));g.lineTo(16+scoop,s*9);g.lineTo(13+scoop,s*5);g.stroke()}/* rear legs */for(let s of [-1,1]){g.beginPath();g.moveTo(-5,s*3);g.lineTo(-10,s*7);g.lineTo(-15,s*6);g.stroke()}/* antennae */g.lineWidth=.7;g.beginPath();g.moveTo(10,-1);g.lineTo(17,-4);g.lineTo(22,-3);g.moveTo(10,1);g.lineTo(17,4);g.lineTo(22,3);g.stroke();g.restore()}function loop(ms){let n=ms/1000,dt=Math.min(.03,n-T||.016);T=n;if(p){let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);if(d<125){let a=Math.atan2(dy,dx);b.a+=Math.atan2(Math.sin(a-b.a),Math.cos(a-b.a))*dt*7;b.dig=1}}b.dig=Math.max(0,b.dig-dt*.7);b.v+=(b.dig?42:7-b.v)*dt*4;b.a+=Math.sin(T*.7)*dt*.28;b.x+=Math.cos(b.a)*b.v*dt;b.y+=Math.sin(b.a)*b.v*dt;if(b.dig&&Math.random()<.35){let side=(Math.random()-.5)*14;crumb.push({x:b.x-Math.cos(b.a)*12+Math.cos(b.a+1.57)*side,y:b.y-Math.sin(b.a)*12+Math.sin(b.a+1.57)*side,vx:-Math.cos(b.a)*(20+Math.random()*35)+(Math.random()-.5)*25,vy:-Math.sin(b.a)*(20+Math.random()*35)+(Math.random()-.5)*25,l:1})}if(b.x<25||b.x>W-25){b.a=Math.PI-b.a;b.x=Math.max(25,Math.min(W-25,b.x))}if(b.y<25||b.y>H-25){b.a=-b.a;b.y=Math.max(25,Math.min(H-25,b.y))}g.fillStyle='#8b6846';g.fillRect(0,0,W,H);g.fillStyle='rgba(45,30,18,.15)';for(let i=0;i<38;i++)g.fillRect((i*79)%W,(i*127)%H,2,2);for(let i=crumb.length-1;i>=0;i--){let z=crumb[i];z.x+=z.vx*dt;z.y+=z.vy*dt;z.vx*=.94;z.vy*=.94;z.l-=dt*1.4;g.globalAlpha=Math.max(0,z.l);g.fillStyle='#5c4029';g.fillRect(z.x,z.y,3,3);g.globalAlpha=1;if(z.l<=0)crumb.splice(i,1)}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
