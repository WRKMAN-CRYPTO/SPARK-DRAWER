<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Brave Little Pixel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eee8da;touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  .label{position:fixed;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;pointer-events:none;color:#302f2b;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.68}
  .hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;pointer-events:none;color:#302f2b;font-size:11px;opacity:.42}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">BRAVE LITTLE PIXEL</div>
<div class="hint">be still · it is trying very hard</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let w=0,h=0,dpr=1,t=0;
let finger={x:0,y:0,px:0,py:0,speed:0,down:false,lastMove:0};
let bug={x:0,y:0,vx:0,vy:0,fear:0,nerve:0,blink:0,look:1};
let dust=[];
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);g.imageSmoothingEnabled=false;
  if(!bug.x){bug.x=w*.5;bug.y=h*.62;finger.x=w*.5;finger.y=h*.34;finger.px=finger.x;finger.py=finger.y}
}
addEventListener('resize',resize);resize();
function point(e){
  let q=e.touches?e.touches[0]:e;
  finger.px=finger.x;finger.py=finger.y;finger.x=q.clientX;finger.y=q.clientY;
  finger.speed=Math.hypot(finger.x-finger.px,finger.y-finger.py);finger.lastMove=performance.now();
}
function start(e){finger.down=true;point(e);if(navigator.vibrate)navigator.vibrate(5)}
function move(e){if(finger.down)point(e)}
function end(){finger.down=false;finger.speed=0}
c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);addEventListener('pointerup',end);addEventListener('pointercancel',end);
c.addEventListener('touchstart',e=>{e.preventDefault();start(e)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});c.addEventListener('touchend',end);
function px(x,y,s=4){g.fillRect(Math.round(x/s)*s,Math.round(y/s)*s,s,s)}
function drawBug(){
  const s=4, moving=Math.hypot(bug.vx,bug.vy)>.35, step=(t>>3)&1;
  g.save();g.translate(Math.round(bug.x/s)*s,Math.round(bug.y/s)*s);
  let flip=bug.look<0?-1:1;g.scale(flip,1);
  g.fillStyle='#2e302c';
  // body: deliberately almost nothing
  g.fillRect(-4,-4,12,8);
  g.fillRect(-8,0,16,4);
  // legs become readable mostly through motion
  let a=moving?(step?4:0):0;
  g.fillRect(-8,4+a,4,4);g.fillRect(4,4+(4-a),4,4);
  // one eye is enough to give the whole lump a direction
  g.fillStyle='#eee8da';g.fillRect(4,-4,4,4);
  if(bug.fear>.42){
    // panic eyebrow / raised pixel
    g.fillStyle='#2e302c';g.fillRect(4,-12,4,4);
  } else if(bug.nerve>.72){
    // tiny hopeful antenna
    g.fillStyle='#2e302c';g.fillRect(0,-8,4,4);
  }
  g.restore();
}
function puff(n=2){for(let i=0;i<n;i++)dust.push({x:bug.x+(Math.random()-.5)*10,y:bug.y+6,vx:(Math.random()-.5)*.5,vy:-Math.random()*.4,a:1})}
function update(){
  t++;
  const now=performance.now();
  finger.speed*=.78;
  let dx=finger.x-bug.x,dy=finger.y-bug.y,d=Math.hypot(dx,dy)||1;
  let still=finger.down && now-finger.lastMove>330;
  let threat=finger.down && (finger.speed>5 || (d<58 && !still));
  if(threat){bug.fear=Math.min(1,bug.fear+.12);bug.nerve=Math.max(0,bug.nerve-.18)}
  else {bug.fear=Math.max(0,bug.fear-.018);if(still)bug.nerve=Math.min(1,bug.nerve+.008);else bug.nerve=Math.max(0,bug.nerve-.002)}
  if(bug.fear>.16){
    let force=.18+.5*bug.fear;bug.vx-=dx/d*force;bug.vy-=dy/d*force;
    if((t%7)==0)puff(1);
  } else if(still && bug.nerve>.2 && d>25){
    let courage=.018+.055*bug.nerve;bug.vx+=dx/d*courage;bug.vy+=dy/d*courage;
  } else {
    bug.vx+=Math.sin(t*.027)*.004;bug.vy+=Math.cos(t*.021)*.003;
  }
  bug.vx*=.91;bug.vy*=.91;bug.x+=bug.vx;bug.y+=bug.vy;
  bug.look=dx<0?-1:1;
  if(bug.x<18){bug.x=18;bug.vx=Math.abs(bug.vx)*.5}if(bug.x>w-18){bug.x=w-18;bug.vx=-Math.abs(bug.vx)*.5}
  if(bug.y<52){bug.y=52;bug.vy=Math.abs(bug.vy)*.5}if(bug.y>h-30){bug.y=h-30;bug.vy=-Math.abs(bug.vy)*.5}
  for(let i=dust.length-1;i>=0;i--){let q=dust[i];q.x+=q.vx;q.y+=q.vy;q.a-=.035;if(q.a<=0)dust.splice(i,1)}
}
function draw(){
  g.clearRect(0,0,w,h);g.fillStyle='#eee8da';g.fillRect(0,0,w,h);
  // finger is only a target marker, not a hand illustration
  if(finger.down){
    g.fillStyle='rgba(171,91,62,.2)';g.beginPath();g.arc(finger.x,finger.y,12,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(171,91,62,.65)';px(finger.x-2,finger.y-2,4);
  }
  for(const q of dust){g.fillStyle=`rgba(46,48,44,${q.a*.22})`;px(q.x,q.y,4)}
  drawBug();
  if(finger.down && bug.nerve>.88 && Math.hypot(finger.x-bug.x,finger.y-bug.y)<30){
    g.fillStyle='rgba(46,48,44,.42)';g.font='10px ui-monospace,monospace';g.textAlign='center';g.fillText('...hi',bug.x,bug.y-24);
  }
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
