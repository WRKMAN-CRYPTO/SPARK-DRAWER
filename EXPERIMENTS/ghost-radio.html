<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Ghost Radio</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080908;color:#d9ded7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}body{background:radial-gradient(circle at 50% 55%,#151a17 0,#080908 62%)}canvas{position:fixed;inset:0;width:100%;height:100%}#label{position:fixed;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;letter-spacing:.22em;font-size:10px;opacity:.45}#hint{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;pointer-events:none;font-size:10px;line-height:1.6;letter-spacing:.08em;opacity:.36;transition:opacity 1s}#freq{position:fixed;left:14px;top:50%;translate:0 -50%;writing-mode:vertical-rl;font-size:9px;letter-spacing:.16em;opacity:.22;pointer-events:none}.awake #hint{opacity:.12}</style></head><body>
<canvas id="c"></canvas><div id="label">GHOST RADIO</div><div id="freq">NO STATION</div><div id="hint">touch anywhere · slide slowly · listen for something hiding between frequencies</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),freqLabel=document.querySelector('#freq');let W=0,H=0,D=1,ctx,master,delay,feedback,wet,noiseBuf,lastX=.5,lastY=.5,down=false,t=0,voices=[],sparks=[],found=new Set();
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function boot(){if(ctx){ctx.resume();return}ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.38;delay=ctx.createDelay(1.2);delay.delayTime.value=.23;feedback=ctx.createGain();feedback.gain.value=.31;wet=ctx.createGain();wet.gain.value=.22;delay.connect(feedback).connect(delay);delay.connect(wet).connect(master);master.connect(ctx.destination);noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);let a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;document.body.classList.add('awake')}
function tone(freq,vol=.07,dur=.35,type='sine',pan=0){boot();let o=ctx.createOscillator(),g=ctx.createGain(),p=ctx.createStereoPanner?ctx.createStereoPanner():null;o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+.018);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);if(p){p.pan.value=pan;o.connect(g).connect(p);p.connect(master);p.connect(delay)}else{o.connect(g).connect(master);g.connect(delay)}o.start();o.stop(ctx.currentTime+dur+.05)}
function hiss(amount=.02,dur=.12){boot();let s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=400+Math.random()*3800;f.Q.value=2+Math.random()*8;g.gain.value=amount;s.connect(f).connect(g).connect(master);s.start();s.stop(ctx.currentTime+dur)}
const stations=[
{x:.13,y:.77,n:'LOW ORBIT',notes:[82.41,123.47,164.81]},
{x:.31,y:.28,n:'THREE KNOCKS',notes:[196,196,293.66]},
{x:.52,y:.58,n:'GLASS WEATHER',notes:[523.25,659.25,783.99]},
{x:.71,y:.22,n:'LATE SIGNAL',notes:[220,329.63,440]},
{x:.86,y:.69,n:'SOMEONE HUMMING',notes:[174.61,261.63,349.23]}
];
function station(px,py){let best=null,bd=1;for(let s of stations){let d=Math.hypot(px-s.x,py-s.y);if(d<bd){bd=d;best=s}}return bd<.075?[best,bd]:[null,bd]}
let lastPing=0;function playAt(px,py){lastX=px;lastY=py;let [s,d]=station(px,py),base=55*Math.pow(2,px*5.25);freqLabel.textContent=Math.round(base)+' Hz';if(s){freqLabel.textContent=s.n;let now=performance.now();if(now-lastPing>125){let n=s.notes[(Math.random()*s.notes.length)|0]*(py<.5?2:1);tone(n,.045+.035*(1-d/.075),.32,'sine',px*2-1);if(Math.random()<.22)tone(n*1.5,.018,.5,'triangle',1-px*2);lastPing=now}found.add(s.n)}else{let now=performance.now();if(now-lastPing>70){tone(base,.014,.09,px>.5?'triangle':'sine',px*2-1);if(Math.random()<.35)hiss(.007+.018*Math.abs(py-.5),.055);lastPing=now}}
for(let i=0;i<2;i++)sparks.push({x:px*W+(Math.random()-.5)*12,y:py*H+(Math.random()-.5)*12,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,a:.8})}
function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);down=true;let p=pt(e);playAt(...p);tone(110+330*p[0],.035,.18,'sine',p[0]*2-1)});c.addEventListener('pointermove',e=>{if(!down)return;let p=pt(e);playAt(...p)});c.addEventListener('pointerup',e=>{down=false;freqLabel.textContent='NO STATION';if(ctx){tone(70+lastY*70,.018,.55,'sine',lastX*2-1)}});c.addEventListener('pointercancel',()=>down=false);
function draw(){t+=.016;x.clearRect(0,0,W,H);x.fillStyle='#080908';x.globalAlpha=.16;x.fillRect(0,0,W,H);x.globalAlpha=1;
for(let i=0;i<72;i++){let yy=(i*97+t*8)%H,xx=(i*53+Math.sin(t+i)*14)%W;x.fillStyle='rgba(180,205,190,'+(0.018+0.018*Math.sin(t*2+i))+')';x.fillRect(xx,yy,1,1)}
if(down){let gx=lastX*W,gy=lastY*H;let g=x.createRadialGradient(gx,gy,0,gx,gy,60);g.addColorStop(0,'rgba(206,234,214,.16)');g.addColorStop(1,'rgba(206,234,214,0)');x.fillStyle=g;x.beginPath();x.arc(gx,gy,60,0,Math.PI*2);x.fill();x.strokeStyle='rgba(220,240,225,.24)';x.lineWidth=1;x.beginPath();x.arc(gx,gy,9+Math.sin(t*8)*2,0,Math.PI*2);x.stroke()}
for(let s of sparks){s.x+=s.vx;s.y+=s.vy;s.a-=.018;x.fillStyle='rgba(214,235,220,'+Math.max(0,s.a)+')';x.fillRect(s.x,s.y,1.5,1.5)}sparks=sparks.filter(s=>s.a>0);requestAnimationFrame(draw)}draw();
</script></body></html>
