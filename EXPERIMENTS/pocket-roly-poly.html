<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pocket Roly-Poly</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#bdb7a6;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}</style><canvas id=c></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,D=devicePixelRatio||1;function fit(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}fit();onresize=fit;let b={x:W*.5,y:H*.52,a:.3,v:16,mode:'walk',timer:0,spin:0},p=null,T=0;onpointerdown=e=>{p={x:e.clientX,y:e.clientY};let r=Math.hypot(b.x-p.x,b.y-p.y);if(r<75&&b.mode==='walk'){b.mode='curl';b.timer=.65;b.v=0}};onpointermove=e=>{if(p)p={x:e.clientX,y:e.clientY}};onpointerup=()=>p=null;function body(){g.save();g.translate(b.x,b.y);g.rotate(b.a+b.spin);g.scale(3,3);if(b.mode==='ball'){g.fillStyle='#403e38';g.beginPath();g.arc(0,0,7,0,7);g.fill();g.strokeStyle='#777267';g.lineWidth=.8;for(let r=2;r<7;r+=2){g.beginPath();g.arc(0,0,r,-2.2,2.2);g.stroke()}g.restore();return}let curl=b.mode==='curl'?1-b.timer/.65:0;g.strokeStyle='#555149';g.lineWidth=1;for(let i=-5;i<=5;i+=2){let k=Math.sin(T*14+i)*1.2;g.beginPath();g.moveTo(i,3);g.lineTo(i-1+k,7);g.moveTo(i,-3);g.lineTo(i-1-k,-7);g.stroke()}for(let i=0;i<7;i++){let xx=-7+i*2.4,yy=Math.sin((i/6)*Math.PI)*curl*5;g.fillStyle=i%2?'#55524b':'#46443f';g.beginPath();g.ellipse(xx+curl*i*.8,yy,3,4,0,0,7);g.fill()}g.restore()}function loop(ms){let n=ms/1000,dt=Math.min(.03,n-T||.016);T=n;if(b.mode==='walk'){b.a+=Math.sin(T*.7)*dt*.5;b.x+=Math.cos(b.a)*b.v*dt;b.y+=Math.sin(b.a)*b.v*dt}else if(b.mode==='curl'){b.timer-=dt;b.spin+=dt*3;if(b.timer<=0){b.mode='ball';b.timer=1.6;b.v=0}}else{b.timer-=dt;b.spin+=b.v*dt/7;b.v+=38*dt;b.x+=Math.cos(b.a)*b.v*dt;b.y+=Math.sin(b.a)*b.v*dt;if(b.timer<=0){b.mode='walk';b.v=18;b.spin=0}}if(b.x<20||b.x>W-20){b.a=Math.PI-b.a;b.x=Math.max(20,Math.min(W-20,b.x))}if(b.y<20||b.y>H-20){b.a=-b.a;b.y=Math.max(20,Math.min(H-20,b.y))}g.fillStyle='#bdb7a6';g.fillRect(0,0,W,H);g.fillStyle='rgba(50,45,35,.12)';for(let i=0;i<22;i++)g.fillRect((i*113)%W,(i*71)%H,2,2);body();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script>
