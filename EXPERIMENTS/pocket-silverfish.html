<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Silverfish</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#d8d5cc;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#h{position:fixed;bottom:18px;width:100%;text-align:center;font:12px monospace;color:#6e6b64;opacity:.72}</style></head><body><canvas id="c"></canvas><div id="h">tap nearby</div><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,S=4;function sz(){W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);c.width=W;c.height=H}sz();addEventListener('resize',sz);const f={x:W*.52,y:H*.55,a:0,v:.22,t:50,w:0,spook:0};function rnd(a,b){return a+Math.random()*(b-a)}addEventListener('pointerdown',e=>{let px=e.clientX/S,py=e.clientY/S,dx=f.x-px,dy=f.y-py;if(Math.hypot(dx,dy)<30){f.a=Math.atan2(dy,dx)+rnd(-.5,.5);f.spook=30;f.v=1.05}});function update(){f.t--;if(f.spook>0){f.spook--;f.v*=.96}else{f.v=.18+Math.sin(performance.now()/320)*.04;if(f.t<0){f.a+=rnd(-1.1,1.1);f.t=rnd(25,90)}}f.x+=Math.cos(f.a)*f.v;f.y+=Math.sin(f.a)*f.v;f.w+=f.v*2.8;if(f.x<7||f.x>W-7){f.a=Math.PI-f.a;f.x=Math.max(7,Math.min(W-7,f.x))}if(f.y<7||f.y>H-7){f.a=-f.a;f.y=Math.max(7,Math.min(H-7,f.y))}}function p(x,y){g.fillRect(Math.round(x),Math.round(y),1,1)}function bug(){g.save();g.translate(Math.round(f.x),Math.round(f.y));g.rotate(f.a);g.fillStyle='#4a4a45';let wig=Math.sin(f.w)*.9;g.fillRect(-4,-1,7,3);p(3,0);p(-5,0);p(-6,wig>0?1:-1);p(-7,wig>0?2:-2);p(-5,-1);p(-5,1);p(4,-1);p(4,1);p(5,-2);p(5,2);p(-2,-2);p(-1,-3);p(0,-2);p(1,2);p(2,3);g.restore()}function draw(){update();g.fillStyle='#d8d5cc';g.fillRect(0,0,W,H);g.fillStyle='#c5c1b7';for(let i=0;i<20;i++)p((i*41)%W,(i*67)%H);bug();requestAnimationFrame(draw)}draw()</script></body></html>
