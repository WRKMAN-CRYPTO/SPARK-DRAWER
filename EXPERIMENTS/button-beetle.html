<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Button Beetle</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111319;color:#e8e5d9;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  .label{position:fixed;left:12px;top:10px;font-size:12px;opacity:.5;pointer-events:none;letter-spacing:.08em}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;opacity:.35;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">BUTTON BEETLE</div>
<div class="hint">tap somewhere. then be suspicious.</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=0,H=0,dpr=1,last=performance.now();
const beetle={x:0,y:0,vx:0,vy:0,tx:0,ty:0,state:'idle',timer:0,blink:0,stolen:false};
let button={x:0,y:0,r:15,visible:false,pulse:0};
let crumbs=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!beetle.x){beetle.x=W*.5;beetle.y=H*.58}}
addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function tap(px,py){
  if(button.visible && Math.hypot(px-button.x,py-button.y)<34){
    button.pulse=1; beetle.state='notice'; beetle.timer=.38; return;
  }
  if(beetle.state==='flee'||beetle.state==='steal') return;
  button.x=clamp(px,28,W-28);button.y=clamp(py,52,H-28);button.visible=true;button.pulse=1;
  beetle.state='pretend';beetle.timer=.5+Math.random()*.45;
}
c.addEventListener('pointerdown',e=>tap(e.clientX,e.clientY));
function update(dt){
  button.pulse=Math.max(0,button.pulse-dt*2.5);
  beetle.blink-=dt;if(beetle.blink<-2-Math.random()*3)beetle.blink=.12;
  beetle.timer-=dt;
  if(beetle.state==='idle'){
    beetle.vx+=Math.sin(performance.now()/700)*dt*3; beetle.vy+=Math.cos(performance.now()/900)*dt*2;
  }
  if(beetle.state==='pretend'&&beetle.timer<=0){beetle.state='notice';beetle.timer=.32;}
  if(beetle.state==='notice'&&beetle.timer<=0&&button.visible){
    beetle.state='approach';
  }
  if(beetle.state==='approach'){
    const dx=button.x-beetle.x,dy=button.y-beetle.y,d=Math.hypot(dx,dy)||1;
    beetle.vx+=dx/d*dt*145;beetle.vy+=dy/d*dt*145;
    if(d<24){beetle.state='steal';beetle.timer=.18;}
  }
  if(beetle.state==='steal'&&beetle.timer<=0){
    button.visible=false;beetle.stolen=true;beetle.state='flee';
    const edge=Math.random()<.5?-1:1;beetle.tx=edge<0?-40:W+40;beetle.ty=clamp(beetle.y+(Math.random()-.5)*180,50,H-30);
    for(let i=0;i<8;i++)crumbs.push({x:beetle.x,y:beetle.y,vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*70,t:.7});
  }
  if(beetle.state==='flee'){
    const dx=beetle.tx-beetle.x,dy=beetle.ty-beetle.y,d=Math.hypot(dx,dy)||1;
    beetle.vx+=dx/d*dt*310;beetle.vy+=dy/d*dt*250;
    if(beetle.x<-30||beetle.x>W+30){
      beetle.x=beetle.x<0?W+18:-18;beetle.y=clamp(55+Math.random()*(H-100),55,H-30);beetle.vx=0;beetle.vy=0;beetle.state='return';beetle.timer=.65;
    }
  }
  if(beetle.state==='return'&&beetle.timer<=0){beetle.state='idle';beetle.stolen=false;}
  beetle.vx*=Math.pow(.06,dt);beetle.vy*=Math.pow(.06,dt);
  beetle.x+=beetle.vx*dt;beetle.y+=beetle.vy*dt;
  beetle.y=clamp(beetle.y,38,H-22);
  crumbs.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.9;q.vy*=.9;q.t-=dt});crumbs=crumbs.filter(q=>q.t>0);
}
function px(a,b,w=3,h=3,col='#d8c36b'){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),w,h)}
function drawBeetle(){
  const b=beetle,dir=b.vx<-.5?-1:1;
  x.save();x.translate(Math.round(b.x),Math.round(b.y));
  const walk=Math.abs(b.vx)+Math.abs(b.vy)>3 ? Math.sin(performance.now()/55)*2:0;
  px(-7,-3,3,2,'#7d6948');px(4,-3,3,2,'#7d6948');
  px(-8,2+walk,3,2,'#7d6948');px(5,2-walk,3,2,'#7d6948');
  px(-7,7-walk,3,2,'#7d6948');px(4,7+walk,3,2,'#7d6948');
  px(-5,-5,10,11,'#b89a58');px(-3,-7,6,4,'#d7bd72');
  px(-1,-5,1,10,'#6d5938');
  const eyeClosed=b.blink>0;
  px(dir>0?2:-3,-6,1,eyeClosed?1:2,'#141414');
  if(b.stolen){px(dir>0?5:-8,-4,4,4,'#d94d4d');px(dir>0?6:-7,-3,2,2,'#ff9b7a');}
  if(b.state==='pretend'){
    x.strokeStyle='#7d6948';x.lineWidth=1;x.beginPath();x.moveTo(-3,-8);x.lineTo(-5,-11);x.moveTo(3,-8);x.lineTo(5,-11);x.stroke();
  }
  x.restore();
}
function draw(){
  x.clearRect(0,0,W,H);
  x.fillStyle='#111319';x.fillRect(0,0,W,H);
  for(let i=0;i<22;i++){const xx=(i*83)%W,yy=(i*47)%H;px(xx,yy,1,1,'#1c2029')}
  if(button.visible){
    const s=1+button.pulse*.2;
    x.beginPath();x.arc(button.x,button.y,button.r*s,0,Math.PI*2);x.fillStyle='#3a1718';x.fill();
    x.beginPath();x.arc(button.x,button.y,button.r-4,0,Math.PI*2);x.fillStyle='#d94d4d';x.fill();
    x.fillStyle='#ff8b7e';x.fillRect(button.x-5,button.y-7,10,3);
  }
  crumbs.forEach(q=>{x.globalAlpha=Math.max(0,q.t/.7);px(q.x,q.y,2,2,'#d94d4d');x.globalAlpha=1});
  drawBeetle();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
