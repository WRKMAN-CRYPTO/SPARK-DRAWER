<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Ceiling Fish</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1420;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  .hint{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#99a6b8;opacity:.7;pointer-events:none;white-space:nowrap;transition:opacity .8s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">tap somewhere below him</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),hint=document.getElementById('hint');
let W=0,H=0,dpr=1,last=performance.now(),t=0,first=true;
const fish={x:90,y:26,vx:42,targetX:null,sulk:0,blink:0,look:1};
const bubbles=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function pop(px,py){
  if(first){first=false;hint.style.opacity=0}
  fish.targetX=px;fish.look=px<fish.x?-1:1;fish.sulk=0;
  bubbles.push({x:px,y:py,r:3,life:1});
}
addEventListener('pointerdown',e=>pop(e.clientX,e.clientY),{passive:true});
function drawFish(){
  const bob=Math.sin(t*3.4)*1.5;
  const px=Math.round(fish.x),py=Math.round(fish.y+bob);
  x.save();x.translate(px,py);x.scale(fish.look,1);
  x.imageSmoothingEnabled=false;
  // tail
  x.fillStyle='#f3a45b';x.fillRect(-16,-3,5,7);x.fillRect(-20,-6,5,4);x.fillRect(-20,3,5,4);
  // body, hanging upside-down under the ceiling
  x.fillStyle='#ffd47a';x.fillRect(-11,-5,19,11);x.fillRect(-7,-8,11,3);x.fillRect(-7,6,11,3);
  x.fillStyle='#e68b52';x.fillRect(-2,6,5,4);
  // face
  x.fillStyle='#17202b';
  if(fish.blink>0){x.fillRect(4,-1,4,1)}else{x.fillRect(5,-2,2,3)}
  x.fillRect(8,3,2,1);
  // tiny suction nub touching the ceiling
  x.fillStyle='#ffd47a';x.fillRect(-2,-11,4,3);
  x.restore();
}
function step(dt){
  t+=dt;
  if(fish.targetX!=null){
    const dx=fish.targetX-fish.x;
    fish.vx+=Math.sign(dx)*85*dt;
    fish.vx*=Math.pow(.35,dt);
    if(Math.abs(dx)<5){fish.targetX=null;fish.vx*=.3;fish.sulk=.8}
  } else {
    fish.vx+=Math.sin(t*.7)*4*dt;
    fish.vx*=Math.pow(.82,dt);
  }
  fish.x+=fish.vx*dt;
  if(fish.x<24){fish.x=24;fish.vx=Math.abs(fish.vx);fish.look=1}
  if(fish.x>W-24){fish.x=W-24;fish.vx=-Math.abs(fish.vx);fish.look=-1}
  if(fish.vx>4)fish.look=1;if(fish.vx<-4)fish.look=-1;
  fish.sulk=Math.max(0,fish.sulk-dt);
  if(Math.random()<dt*.28)fish.blink=.09;fish.blink=Math.max(0,fish.blink-dt);
  for(let i=bubbles.length-1;i>=0;i--){let b=bubbles[i];b.r+=45*dt;b.life-=1.3*dt;if(b.life<=0)bubbles.splice(i,1)}
}
function render(){
  x.clearRect(0,0,W,H);
  // ceiling band
  x.fillStyle='#182231';x.fillRect(0,0,W,15);
  x.fillStyle='#253246';for(let i=0;i<W;i+=28)x.fillRect(i,13,14,2);
  // faint waterless ripples where you tap
  for(const b of bubbles){x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.strokeStyle=`rgba(137,191,255,${b.life*.35})`;x.lineWidth=1.5;x.stroke()}
  // invisible gravity joke: little dust rises upward near fish
  for(let i=0;i<7;i++){const yy=((t*13+i*53)%H);const xx=(i*71+Math.sin(t+i)*19)%W;x.fillStyle='rgba(180,196,218,.18)';x.fillRect(xx,H-yy,1,1)}
  drawFish();
  if(fish.sulk>0){x.fillStyle=`rgba(213,224,239,${fish.sulk*.55})`;x.font='11px system-ui';x.textAlign='center';x.fillText('...not food.',fish.x,53)}
}
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;step(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
